version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - rowserrcheck
    - sqlclosecheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - docs/design/legacy-schemas
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
