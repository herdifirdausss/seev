apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seev-aws-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: seev
    seev.io/provider: aws
    seev.io/environment: dev
  annotations:
    seev.io/deploy-note: |
      DEPLOY-003: Uses dedicated seev AppProject (not "default") and pins
      targetRevision to a specific commit SHA or release tag for cloud
      deployments. Update targetRevision on each controlled promotion.
spec:
  project: seev
  source:
    repoURL: https://github.com/herdifirdausss/seev.git
    targetRevision: 547e1a2caf9e45a09989e1c71771837d097f3bfc
    path: deploy/helm/seev
    helm:
      valueFiles:
        - values.yaml
        - values-aws-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: seev-app
  syncPolicy:
    # No automated sync — dev promotions are deliberate, operator-triggered.
    # Prune=false is set explicitly so orphaned resources are flagged as OutOfSync
    # rather than silently deleted on the next sync.
    syncOptions:
      - CreateNamespace=true
      - Prune=false
    retry:
      limit: 3
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
