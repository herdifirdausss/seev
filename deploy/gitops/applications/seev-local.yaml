apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seev-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: seev
    seev.io/environment: local
  annotations:
    seev.io/deploy-note: |
      DEPLOY-003: Local learning environment uses the seev AppProject with
      self-heal enabled. targetRevision=main is acceptable here because this
      environment is disposable (kind cluster only). Cloud/staging Applications
      must pin to an immutable commit SHA or release tag.
spec:
  project: seev
  source:
    repoURL: https://github.com/herdifirdausss/seev.git
    targetRevision: main
    path: deploy/helm/seev
    helm:
      valueFiles:
        - values.yaml
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: seev-app
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
