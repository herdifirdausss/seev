{{- if .Values.autoscaling.enabled }}
{{- range $name := .Values.autoscaling.services }}
{{- if (index $.Values.services $name).enabled }}
{{- $globalMin := $.Values.autoscaling.minReplicas }}
{{- $globalMax := $.Values.autoscaling.maxReplicas }}
{{- $globalCPU := $.Values.autoscaling.targetCPUUtilizationPercentage }}
{{- $perSvc := index (default dict $.Values.autoscaling.perService) $name | default dict }}
{{- $minReplicas := default $globalMin $perSvc.minReplicas }}
{{- $maxReplicas := default $globalMax $perSvc.maxReplicas }}
{{- $targetCPU := default $globalCPU $perSvc.targetCPUUtilizationPercentage }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.global.appNamespace }}
  labels:
    {{- include "seev.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-service
  minReplicas: {{ $minReplicas }}
  maxReplicas: {{ $maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $targetCPU }}
---
{{- end }}
{{- end }}
{{- end }}
