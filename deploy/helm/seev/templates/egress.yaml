{{- if .Values.egress.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: {{ .Values.global.egressNamespace }}
  labels:
    {{- include "seev.labels" . | nindent 4 }}
data:
  squid.conf: |
    acl SSL_ports port 443
    acl CONNECT method CONNECT
    acl allowed_vendor dstdomain {{ join " " .Values.egress.allowedDomains }}
    http_access deny CONNECT !SSL_ports
    http_access allow CONNECT allowed_vendor
    http_access allow allowed_vendor
    http_access deny all
    http_port 3128
    cache deny all
    access_log stdio:/tmp/access.log
    cache_log /tmp/cache.log
    pid_filename /tmp/squid.pid
---
apiVersion: v1
kind: Service
metadata:
  name: squid
  namespace: {{ .Values.global.egressNamespace }}
  labels:
    app.kubernetes.io/part-of: seev
    seev.io/egress: squid
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: seev
    seev.io/egress: squid
  ports:
    - name: proxy
      port: {{ .Values.egress.servicePort }}
      targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: squid
  namespace: {{ .Values.global.egressNamespace }}
  labels:
    {{- include "seev.labels" . | nindent 4 }}
    seev.io/egress: squid
spec:
  replicas: {{ .Values.egress.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: seev
      seev.io/egress: squid
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: seev
        seev.io/egress: squid
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: {{ .Values.egress.image | quote }}
          ports:
            - name: proxy
              containerPort: 3128
          readinessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.egress.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
            - name: cache
              mountPath: /var/spool/squid
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: squid-config
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
