{{- if .Values.data.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: seev-postgres-init
  namespace: {{ .Values.global.dataNamespace }}
  labels:
    {{- include "seev.labels" . | nindent 4 }}
data:
  01-create-databases.sh: |
    #!/bin/sh
    set -eu
    for service in "gateway GATEWAY" "auth AUTH" "ledger LEDGER" "payin PAYIN" "payout PAYOUT" "fraud FRAUD" "adminbff ADMINBFF" "assurance ASSURANCE" "vendor VENDOR"; do
      set -- $service
      name="$1"
      prefix="$2"
      eval "db_user=\${${prefix}_DB_USER}"
      eval "db_password=\${${prefix}_DB_PASSWORD}"
      eval "db_name=\${${prefix}_DB_NAME}"
      psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --set=ON_ERROR_STOP=1 -v db_user="$db_user" -v db_password="$db_password" -v db_name="$db_name" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'db_user')\gexec
    SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'db_user', :'db_password')\gexec
    SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'db_user')
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name')\gexec
    SQL
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.global.dataNamespace }}
  labels:
    app.kubernetes.io/part-of: seev
    seev.io/data: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: seev
    seev.io/data: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.global.dataNamespace }}
  labels:
    {{- include "seev.labels" . | nindent 4 }}
    seev.io/data: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: seev
      seev.io/data: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: seev
        seev.io/data: postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.data.postgres.image | quote }}
          env:
            - name: POSTGRES_USER
              value: seev
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.dataSecret }}
                  key: postgres-super-password
            - name: POSTGRES_DB
              value: seev
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            {{ range $name, $spec := .Values.services }}
            {{ if $spec.enabled }}
            - name: {{ upper (replace "-" "" $name) }}_DB_USER
              value: {{ printf "%s_app" (replace "-" "" $name) | quote }}
            - name: {{ upper (replace "-" "" $name) }}_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.dataSecret }}
                  key: {{ printf "%s-postgres-password" $name }}
            - name: {{ upper (replace "-" "" $name) }}_DB_NAME
              value: {{ printf "seev_%s" (replace "-" "" $name) | quote }}
            {{ end }}
            {{ end }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.data.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-create-databases.sh
              subPath: 01-create-databases.sh
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: seev-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{ if .Values.data.postgres.storageClass }}
        storageClassName: {{ .Values.data.postgres.storageClass | quote }}
        {{ end }}
        resources:
          requests:
            storage: {{ .Values.data.postgres.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.global.dataNamespace }}
  labels:
    app.kubernetes.io/part-of: seev
    seev.io/data: redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: seev
    seev.io/data: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: {{ .Values.global.dataNamespace }}
  labels:
    {{- include "seev.labels" . | nindent 4 }}
    seev.io/data: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: seev
      seev.io/data: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: seev
        seev.io/data: redis
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.data.redis.image | quote }}
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.data.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{ if .Values.data.redis.storageClass }}
        storageClassName: {{ .Values.data.redis.storageClass | quote }}
        {{ end }}
        resources:
          requests:
            storage: {{ .Values.data.redis.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Values.global.dataNamespace }}
  labels:
    app.kubernetes.io/part-of: seev
    seev.io/data: rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: seev
    seev.io/data: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: {{ .Values.global.dataNamespace }}
  labels:
    {{- include "seev.labels" . | nindent 4 }}
    seev.io/data: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: seev
      seev.io/data: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: seev
        seev.io/data: rabbitmq
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: {{ .Values.data.rabbitmq.image | quote }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: seev
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.dataSecret }}
                  key: rabbitmq-password
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          readinessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: ["rabbitmq-diagnostics", "-q", "ping"]}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.data.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{ if .Values.data.rabbitmq.storageClass }}
        storageClassName: {{ .Values.data.rabbitmq.storageClass | quote }}
        {{ end }}
        resources:
          requests:
            storage: {{ .Values.data.rabbitmq.storageSize }}
{{- end }}
