# Synthetic, secretless readiness fixture. This is never deployed; it proves
# that a fully resolved overlay can pass the same fail-closed promotion gate.
global:
  image:
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  postgres:
    host: postgres.staging.internal.example
  redis:
    addr: redis.staging.internal.example:6379
  rabbitmq:
    host: rabbitmq.staging.internal.example

migrations:
  image:
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

networkPolicy:
  managedDataCIDRs:
    postgres: [10.50.1.0/24]
    redis: [10.50.2.0/24]
    rabbitmq: [10.50.3.0/24]

traefik:
  allowedCallbackCIDRs: [203.0.113.0/24]

services:
  auth:
    env:
      KYC_PROVIDER_URL: https://kyc.staging.example
  vendor:
    callbackCIDRs: 203.0.113.0/24
    trustedProxyCIDRs: 10.40.0.0/16
    env:
      VENDOR_CALLBACK_CIDRS: 203.0.113.0/24
      VENDOR_CALLBACK_TRUSTED_PROXY_CIDRS: 10.40.0.0/16
