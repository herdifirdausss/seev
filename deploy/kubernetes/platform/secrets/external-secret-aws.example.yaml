apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: seev-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_WITH_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: seev-secrets-reader
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: seev-runtime-secrets
  namespace: seev-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: seev-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef: {key: REPLACE_WITH_RUNTIME_SECRET_OBJECT, property: jwt-secret}
    - secretKey: internal-grpc-token
      remoteRef: {key: REPLACE_WITH_RUNTIME_SECRET_OBJECT, property: internal-grpc-token}
