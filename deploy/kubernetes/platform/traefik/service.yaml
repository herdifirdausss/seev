apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: seev-edge
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: seev
    seev.io/edge: public
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
    seev.io/edge: public
  ports:
    - name: web
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
