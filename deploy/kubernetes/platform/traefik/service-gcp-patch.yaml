apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: seev-edge
  annotations:
    # Set the value to the name of google_compute_address.ingress. This keeps
    # the first cloud edge on the external passthrough L4 path.
    networking.gke.io/load-balancer-ip-addresses: REPLACE_WITH_GCP_INGRESS_ADDRESS_NAME
    cloud.google.com/l4-rbs: "enabled"
