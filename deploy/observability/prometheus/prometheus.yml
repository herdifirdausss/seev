# Scrapes /metrics on each service's internal/admin listener only, never the
# public listener (docs/roadmap/archive/10 Task T6 boundary).
# docs/roadmap/archive/49 K6: every one of those listeners requires mTLS —
# Prometheus presents the "prometheus" client identity and trusts only the
# shared CA.
#
# server_name is set per job to match the DNS SAN in each leaf certificate
# (DEPLOY-004). The certgen tool now issues DNS SANs alongside SPIFFE URI SANs
# so Prometheus can perform full server identity verification without
# insecure_skip_verify.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/slo.yml
  - /etc/prometheus/rules/backup.yml
  - /etc/prometheus/rules/retention.yml
  - /etc/prometheus/rules/merchant.yml
  - /etc/prometheus/rules/notifications.yml
  - /etc/prometheus/rules/improvement.yml
  - /etc/prometheus/rules/analytics.yml

scrape_configs:
  - job_name: gateway-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: gateway-service
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-service:8081"]

  - job_name: auth-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8083"]

  - job_name: ledger-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: ledger-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ledger-service:8091"]

  - job_name: payin-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: payin-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payin-service:8092"]

  - job_name: payout-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: payout-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payout-service:8093"]

  - job_name: fraud-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: fraud-service
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-service:8094"]

  - job_name: admin-bff-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: admin-bff-service
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-bff-service:8095"]

  - job_name: assurance-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: assurance-service
    metrics_path: /metrics
    static_configs:
      - targets: ["assurance-service:8096"]

  - job_name: vendor-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: vendor-service
    metrics_path: /metrics
    static_configs:
      - targets: ["vendor-service:8098"]

  # docs/roadmap/archive/50 T2 (K13) — backup-agent runs only under the opt-in
  # "backup" Compose profile, so this target shows "down" unless that profile
  # is started. The server_name matches the DNS SAN in the backup-agent cert.
  - job_name: backup-agent
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      server_name: backup-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["backup-agent:8097"]

  # Plan 58 (C2) section 24 — the analytics stack runs on its own Compose
  # project/network (analytics/compose/docker-compose.analytics.yml) with no
  # mTLS: ClickHouse and Redpanda are third-party images. Reached via
  # host.docker.internal + published host ports. These targets legitimately
  # show "down" whenever the opt-in analytics profile is not running.
  - job_name: analytics-clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9363"]

  - job_name: analytics-redpanda
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9644"]

  - job_name: analytics-metrics-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9308"]
