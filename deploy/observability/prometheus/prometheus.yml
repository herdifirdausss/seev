# docs/roadmap/archive/43 Task T1 — scrapes /metrics on each service's internal/admin
# listener only, never the public listener (docs/roadmap/archive/10 Task T6 boundary).
# docs/roadmap/archive/49 K6: every one of those listeners now requires mTLS —
# Prometheus presents the "prometheus" client identity and trusts only the
# shared CA, mirroring what a real dev-operator curl session needs.
#
# insecure_skip_verify: true is required in every tls_config below — found
# live in docs/roadmap/archive/50 T2 execution, not a pre-existing pattern to copy
# without it: this repo's leaf certs carry a SPIFFE URI SAN only, never a
# DNS SAN (internal/platform/security/tls/config.go's own comments), so Prometheus's stock Go TLS
# client can never satisfy standard hostname verification against any of
# these listeners no matter how correct ca_file/cert_file/key_file are.
# Confirmed live: every job below reported health "down" with
# "x509: certificate is not valid for any names, but wanted to match
# <hostname>" until this was added. Client identity is still fully
# enforced — this only skips Prometheus's own verification of the SERVER;
# the server side (internal/platform/security/tls.ServerConfig) still requires and verifies
# Prometheus's own client certificate against the CA and the
# IdentityPrometheus allowlist, exactly as it does for every other caller.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/slo.yml
  - /etc/prometheus/rules/backup.yml
  - /etc/prometheus/rules/retention.yml
  - /etc/prometheus/rules/merchant.yml
  - /etc/prometheus/rules/notifications.yml
  - /etc/prometheus/rules/improvement.yml
  - /etc/prometheus/rules/analytics.yml

scrape_configs:
  - job_name: gateway-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-service:8081"]

  - job_name: auth-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8083"]

  - job_name: ledger-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["ledger-service:8091"]

  - job_name: payin-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["payin-service:8092"]

  - job_name: payout-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["payout-service:8093"]

  - job_name: fraud-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-service:8094"]

  # admin-bff-service and assurance-service had no scrape job at all before
  # docs/roadmap/archive/49 (TM-04/TM-09 in docs/security/threat-model.md) — added
  # here rather than left as a metrics blind spot now that both listeners
  # are being flipped to mTLS in this same task anyway.
  - job_name: admin-bff-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-bff-service:8095"]

  - job_name: assurance-service
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["assurance-service:8096"]

  # docs/roadmap/archive/50 T2 (K13) — backup-agent runs only under the opt-in
  # "backup" Compose profile, so this target is unreachable (and simply
  # shows as "down" in Prometheus, not an error) unless that profile is
  # started; scraped the same mTLS way as every other internal listener
  # (see insecure_skip_verify rationale at the top of this file).
  - job_name: backup-agent
    scheme: https
    tls_config:
      ca_file: /certs/ca.pem
      cert_file: /certs/prometheus.pem
      key_file: /certs/prometheus-key.pem
      insecure_skip_verify: true
    metrics_path: /metrics
    static_configs:
      - targets: ["backup-agent:8097"]

  # Plan 58 (C2) section 24 — the analytics stack runs on its own Compose
  # project/network (analytics/compose/docker-compose.analytics.yml, opt-in
  # "analytics-core"/"analytics-ops" profiles) with no mTLS: ClickHouse and
  # Redpanda are third-party images that don't speak this repo's SPIFFE-based
  # client-cert pattern, and ports are already loopback-only per plan
  # section 12.2/23.2. Reached via host.docker.internal + the published
  # host ports, the same pattern the connect service already uses to reach
  # the source Postgres. These targets legitimately show "down" whenever
  # the opt-in analytics profile is not running — that is not an incident.
  - job_name: analytics-clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9363"]

  - job_name: analytics-redpanda
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9644"]

  # Serves seev_analytics_reconciliation_*/data_freshness_seconds/
  # dbt_run_total/connector_up (analytics/reconciliation/cmd/metrics-exporter),
  # started locally via `make analytics-metrics-exporter`. Kafka Connect
  # itself is not scraped here — this Debezium image build has no JMX
  # exporter bundled, and the plan's own dashboard spec already treats
  # connector status as external operational evidence
  # (analytics/metabase/dashboards/data-platform-health.yaml); the exporter
  # covers that gap by polling Connect's REST API directly instead.
  - job_name: analytics-metrics-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9308"]
