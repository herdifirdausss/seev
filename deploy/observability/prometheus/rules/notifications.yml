# C3 notification health. Labels are restricted to channel, kind, provider,
# bounded status, and bounded reason; no user, event, delivery, address, or
# token identifier is allowed in an alert label.
groups:
- name: notifications-c3
  interval: 30s
  rules:
  - alert: SeevNotificationEventDLQGrowth
    expr: increase(rabbitmq_dlq_messages_total{queue="ledger.events.notifications"}[15m]) > 0
    for: 2m
    labels:
      severity: critical
      service: notifications
    annotations:
      summary: "notification event messages are entering the ledger notification DLQ"
      runbook: docs/runbooks/notification-event-dlq.md

  - alert: SeevNotificationMandatoryTemplateMissing
    expr: increase(seev_notification_template_missing_total{channel="in_app"}[10m]) > 0
    for: 1m
    labels:
      severity: critical
      service: notifications
    annotations:
      summary: "a mandatory in-app notification template is missing"
      runbook: docs/runbooks/notification-template-missing.md

  - alert: SeevNotificationPlanningFailure
    expr: increase(seev_notification_planning_failures_total[10m]) > 0
    for: 2m
    labels:
      severity: critical
      service: notifications
    annotations:
      summary: "notification planning failures were recorded"
      runbook: docs/runbooks/notification-template-incident.md

  - alert: SeevNotificationEmailBacklog
    expr: seev_notification_oldest_due_age_seconds{channel="email"} > 300
    for: 5m
    labels:
      severity: warning
      service: notifications
      channel: email
    annotations:
      summary: "the oldest email notification delivery has been due for over five minutes"
      runbook: docs/runbooks/notification-email-backlog.md

  - alert: SeevNotificationPushBacklog
    expr: seev_notification_oldest_due_age_seconds{channel="push"} > 300
    for: 5m
    labels:
      severity: warning
      service: notifications
      channel: push
    annotations:
      summary: "the oldest push notification delivery has been due for over five minutes"
      runbook: docs/runbooks/notification-push-backlog.md

  - alert: SeevNotificationContactResolutionFailure
    expr: increase(seev_notification_contact_resolution_total{result="error"}[15m]) > 0
    for: 5m
    labels:
      severity: warning
      service: notifications
    annotations:
      summary: "Auth notification-contact resolution is failing"
      runbook: docs/runbooks/notification-auth-contact-outage.md

  - alert: SeevNotificationDeadDeliveryGrowth
    expr: increase(seev_notification_dead_total[15m]) > 0
    for: 1m
    labels:
      severity: critical
      service: notifications
    annotations:
      summary: "notification deliveries have exhausted their retry budget"
      runbook: docs/runbooks/notification-dead-delivery.md

  - alert: SeevNotificationBlockedDeliveryGrowth
    expr: increase(seev_notification_blocked_total[15m]) > 0
    for: 2m
    labels:
      severity: warning
      service: notifications
    annotations:
      summary: "notification deliveries are being blocked before provider dispatch"
      runbook: docs/runbooks/notification-template-missing.md

  - alert: SeevNotificationDigestScheduleLag
    expr: seev_notification_digest_schedule_lag_seconds > 900
    for: 5m
    labels:
      severity: warning
      service: notifications
      channel: digest
    annotations:
      summary: "daily notification digest scheduling is over fifteen minutes late"
      runbook: docs/runbooks/notification-digest-lag.md

  - alert: SeevNotificationChannelPaused
    expr: seev_notification_channel_state{state="paused"} == 1
    for: 15m
    labels:
      severity: warning
      service: notifications
    annotations:
      summary: "a notification channel has remained paused"
      runbook: docs/runbooks/notification-channel-pause.md

  - alert: SeevNotificationInvalidDeviceSpike
    expr: increase(seev_notification_delivery_attempts_total{channel="push",result="invalid_endpoint"}[15m]) >= 5
    for: 2m
    labels:
      severity: warning
      service: notifications
      channel: push
    annotations:
      summary: "push invalid-device responses are spiking"
      runbook: docs/runbooks/notification-device-token-compromise.md

  - alert: SeevNotificationProviderFailureRate
    expr: |
      (
        sum by (channel, provider) (rate(seev_notification_delivery_attempts_total{result="failed"}[10m]))
        /
        clamp_min(sum by (channel, provider) (rate(seev_notification_delivery_attempts_total[10m])), 0.001)
      ) > 0.20
    for: 10m
    labels:
      severity: warning
      service: notifications
    annotations:
      summary: "notification provider failure rate is above twenty percent"
      runbook: docs/runbooks/notification-provider-outage.md

  - alert: SeevNotificationRetentionFailure
    expr: increase(seev_retention_runs_total{owner="gateway",result="error"}[1h]) > 0
    for: 10m
    labels:
      severity: critical
      service: notifications
    annotations:
      summary: "Gateway notification retention or recipient-erasure work is failing"
      runbook: docs/runbooks/notification-recipient-data-exposure.md
