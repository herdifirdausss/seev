command_classification:
  long_running_service:
    - services/gateway/cmd/gateway
    - services/auth/cmd/auth
    - services/ledger/cmd/ledger
    - services/payin/cmd/payin
    - services/payout/cmd/payout
    - services/fraud/cmd/fraud
    - services/adminbff/cmd/adminbff
    - services/assurance/cmd/assurance
    - services/vendor-service/cmd/vendor
  one_shot_migration:
    - tools/migrate
  certificate_tool:
    - tools/certgen
  backup_utility:
    - operations/agents/backup/cmd/backup-agent
  administrative_cli:
    - operations/recovery/drreseed/cmd/drreseed
    - operations/recovery/drverify/cmd/drverify
    - tools/gentoken
    - tools/retentionctl
    - services/fraud/cmd/sanctions-loader
  test_or_fixture_helper:
    - tools/cryptox-fixture
    - tools/loadcheck
    - tools/loaddataset
    - tools/loadprobe
    - tools/loadreport
  validation_or_generator:
    - tools/contractcheck
    - tools/contractgenerate
    - tools/doccheck
    - tools/retentioncheck
  first_deployment_relevance:
    migration: enabled-as-one-shot-job
    backup-agent: deferred-operations-only
    certgen: deferred-build-or-secret-provisioning-tool
    all-other-non-service-tools: local-or-ci-only

auxiliary_processes:
  - name: object-store-init
    compose_service: object-store-init
    class: one-shot
    kubernetes_relevance: local-compose-init-only
    first_deployment: true
    source: docker-compose.yml
  - name: migration-runner
    command: ./tools/migrate
    class: one-shot
    kubernetes_relevance: migration-job
    first_deployment: true
    source: tools/migrate/main.go
  - name: postgres
    compose_service: postgres
    class: stateful-infrastructure
    kubernetes_relevance: local-compose-dependency
    first_deployment: true
    source: docker-compose.yml
  - name: redis
    compose_service: redis
    class: stateful-infrastructure
    kubernetes_relevance: local-compose-dependency
    first_deployment: true
    source: docker-compose.yml
  - name: rabbitmq
    compose_service: rabbitmq
    class: stateful-infrastructure
    kubernetes_relevance: local-compose-dependency
    first_deployment: true
    source: docker-compose.yml
