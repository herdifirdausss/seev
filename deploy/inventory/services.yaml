      admin: true
      internal: true
    workers:
      - kyc-apply-retry
      - kyc-expiry
      - sanctions-rescreen
      - retention
      - object-delete-outbox
      - privacy-export
      - closure-saga
    first_deployment:
      enabled: true
      data_policy: synthetic-only
    unknowns:
      - real KYC provider endpoint is downstream of K1 and disabled in first deployment
    sources:
      - cmd/auth-service/main.go
      - internal/auth
      - Dockerfile
      - docker-compose.yml

