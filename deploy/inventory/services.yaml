source_hierarchy:
  - running behavior and tests
  - application code
  - Dockerfile and docker-compose.yml
  - API contracts and configuration validation
  - current deployment documentation
services:
  - name: gateway
    current:
      command: ./services/gateway/cmd/gateway
      compose_service: gateway-service
      build_service: gateway
      image: seev/gateway-service
      binary: /app/service
      app_name: gateway-service
    roles:
      request_server: true
      grpc_server: false
      background_workers: true
      one_process_per_pod: true
    ownership:
      database: seev_gateway
      business_owner: payments-platform
    exposure:
      public: true
      callback: false
      admin: true
      internal: true
    workers:
      - merchant-webhook-relay
      - merchant-webhook-consumer
      - notification-consumer
      - retention
      - observability-refresh
    first_deployment:
      enabled: true
      data_policy: synthetic-only
    unknowns: []
    sources:
      - services/gateway/cmd/gateway/main.go
      - Dockerfile
      - docker-compose.yml
      - services/gateway/internal/transport/http/router.go

  - name: auth
