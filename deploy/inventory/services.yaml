command_classification:
  long_running_service:
    - cmd/gateway
    - cmd/auth-service
    - cmd/ledger-service
    - cmd/payin-service
    - cmd/payout-service
    - cmd/fraud-service
    - cmd/admin-bff-service
    - cmd/assurance-service
    - cmd/vendor-service
  one_shot_migration:
    - cmd/migrate
  certificate_tool:
    - cmd/certgen
  backup_utility:
    - cmd/backup-agent
  administrative_cli:
    - cmd/drreseed
    - cmd/drverify
    - cmd/gentoken
    - cmd/retentionctl
    - cmd/sanctions-loader
  test_or_fixture_helper:
    - cmd/cryptox-fixture
    - cmd/loadcheck
    - cmd/loaddataset
    - cmd/loadprobe
    - cmd/loadreport
  validation_or_generator:
    - cmd/contractcheck
    - cmd/contractgenerate
    - cmd/doccheck
    - cmd/retentioncheck
  first_deployment_relevance:
    migration: enabled-as-one-shot-job
    backup-agent: deferred-operations-only
    certgen: deferred-build-or-secret-provisioning-tool
    all-other-non-service-tools: local-or-ci-only

auxiliary_processes:
  - name: object-store-init
    compose_service: object-store-init
    class: one-shot
    kubernetes_relevance: local-compose-init-only
    first_deployment: true
    source: docker-compose.yml
  - name: migration-runner
    command: ./cmd/migrate
    class: one-shot
    kubernetes_relevance: migration-job
    first_deployment: true
    source: cmd/migrate/main.go
  - name: postgres
    compose_service: postgres
    class: stateful-infrastructure
    kubernetes_relevance: local-compose-dependency
    first_deployment: true
    source: docker-compose.yml
  - name: redis
    compose_service: redis
    class: stateful-infrastructure
    kubernetes_relevance: local-compose-dependency
    first_deployment: true
    source: docker-compose.yml
  - name: rabbitmq
    compose_service: rabbitmq
    class: stateful-infrastructure
    kubernetes_relevance: local-compose-dependency
    first_deployment: true
    source: docker-compose.yml
