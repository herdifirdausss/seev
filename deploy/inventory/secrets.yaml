version: 1
baseline_commit: ff21bf186f95431a386b339ee3a1409e49a7e1b0
value_policy: names, ownership, and handling only; never record secret values
secrets:
  - name: POSTGRES_PASSWORD
    owner: platform-data
    consumers: [postgres, migration-runner]
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: local-compose-only
    rotation: restart-and-migration-coordinated
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: .env.example
  - name: RABBITMQ_PASSWORD
    owner: messaging-platform
    consumers: [rabbitmq, all AMQP clients]
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: broker-clients
    rotation: reconnect-coordinated
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: .env.example
  - name: REDIS_PASSWORD
    owner: platform-data
    consumers: [redis clients]
    input: env-or-Kubernetes-Secret
    required_to_boot: false
    shared: local-compose-only
    rotation: reconnect-coordinated
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: .env.example
  - name: JWT_SECRET
    owner: auth
    consumers: [auth, gateway token validation]
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: service-contract
    rotation: key-versioning-required
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: .env.example
  - name: INTERNAL_GRPC_TOKEN
    owner: platform-security
    consumers: internal HTTP privacy/admin paths
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: service-contract
    rotation: coordinated-restart
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: internal/config/config.go
  - name: CRYPTOX_KEY_RING
    owner: platform-security
    consumers: ledger, payout, vendor, gateway
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: controlled-key-ring
    rotation: versioned-key-ring
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: pkg/cryptox
  - name: CRYPTOX_LOOKUP_KEY
    owner: platform-security
    consumers: cryptox lookup paths
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: controlled-key-material
    rotation: versioned-key-ring
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: pkg/cryptox
  - name: LEDGER_IDEMPOTENCY_KEYS
    owner: ledger
    consumers: ledger
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: false
    rotation: versioned-key-ring
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: internal/ledger
  - name: MERCHANT_API_KEY_PEPPER
    owner: gateway
    consumers: gateway
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: false
    rotation: coordinated-rehash
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: internal/merchant
  - name: VENDOR_HMAC_SECRETS
    owner: vendor
    consumers: vendor callback registry
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: per-vendor
    rotation: vendor-coordinated
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: internal/vendorboundary
  - name: KYC_PROVIDER_TOKEN
    owner: auth
    consumers: auth KYC integration
    input: env-or-Kubernetes-Secret
    required_to_boot: false
    shared: false
    rotation: provider-coordinated
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: internal/auth
  - name: EXPORT_KEK
    owner: auth
    consumers: auth privacy export
    input: env-or-Kubernetes-Secret
    required_to_boot: false
    shared: false
    rotation: versioned-key-ring
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: internal/auth/privacy_worker.go
  - name: CLOSURE_KEK
    owner: auth
    consumers: auth closure saga
    input: env-or-Kubernetes-Secret
    required_to_boot: false
    shared: false
    rotation: versioned-key-ring
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: internal/auth
  - name: BOOTSTRAP_ADMIN_CREDENTIALS
    owner: auth
    consumers: auth startup bootstrap
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: false
    rotation: immediately-after-bootstrap
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: cmd/auth-service/main.go
  - name: BOOTSTRAP_MAKER_CHECKER_CREDENTIALS
    owner: admin-bff
    consumers: auth startup and admin operations
    input: env-or-Kubernetes-Secret
    required_to_boot: true
    shared: false
    rotation: immediately-after-bootstrap
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: cmd/auth-service/main.go
  - name: TLS_CA_PRIVATE_KEY
    owner: platform-security
    consumers: certificate provisioning only
    input: mounted file or secret manager
    required_to_boot: false
    shared: certificate-authority-only
    rotation: CA-lifecycle
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: pkg/tlsx
  - name: TLS_SERVICE_LEAF_PRIVATE_KEYS
    owner: platform-security
    consumers: one service identity per workload
    input: mounted file or secret manager
    required_to_boot: true
    shared: per-service in Kubernetes; shared directory only in Compose
    rotation: leaf-lifecycle
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: pkg/tlsx, docker-compose.yml
  - name: TLS_DEV_OPERATOR_PRIVATE_KEY
    owner: platform-security
    consumers: local and private admin probes
    input: mounted file or secret manager
    required_to_boot: false
    shared: operator-only
    rotation: operator-lifecycle
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: pkg/tlsx
  - name: BACKUP_REPOSITORY_CREDENTIALS
    owner: operations
    consumers: backup-agent
    input: env-or-secret-manager
    required_to_boot: false
    shared: operations-only
    rotation: repository-lifecycle
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: cmd/backup-agent/main.go
  - name: ALERT_WEBHOOK_CREDENTIALS
    owner: assurance
    consumers: assurance alerting
    input: env-or-Kubernetes-Secret
    required_to_boot: false
    shared: false
    rotation: provider-coordinated
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: cmd/assurance-service/main.go
  - name: VAULT_TOKEN
    owner: platform-security
    consumers: local secret provisioning only
    input: local environment
    required_to_boot: false
    shared: operator-only
    rotation: external-secret-manager
    target: Secret
    never_log: true
    value_policy: NEVER_RECORD
    source: .env.example
shared_key_findings:
  compose_shared_cert_directory: risk
  kubernetes_required_behavior: one leaf identity and one mounted private key per workload
  shared_cryptographic_rings: deliberate contract; K3 must model access by consumer
  downstream_owner: K3 values and platform-security review
