redis:
  - name: local-redis
    endpoint: redis:6379
    database_number: 0
    owner: shared-runtime-with-prefix-ownership
    key_prefixes:
      - auth rate limits and sessions
      - gateway rate limits and merchant observability
      - fraud velocity windows
      - idempotency and short-lived workflow state
    durability: cache/ephemeral; database is not the system of record
    failure_behavior: feature-specific degradation; money paths fail closed where required
    ttl_policy: per-key feature TTL; inventory values are in source/config
    backup_policy: not authoritative; no backup restore dependency
    sources: [docker-compose.yml, internal/platform/config, internal/platform/cache, services/fraud]

rabbitmq:
  - name: ledger-events-broker
    endpoint: rabbitmq:5672
    exchange: ledger.events
    exchange_type: topic
    owner: messaging-platform
    durability: durable exchange and queues
    delivery: publisher-confirms; at-least-once consumers; DLX/DLQ
    topology_ref: deploy/inventory/messaging.yaml
    sources: [internal/platform/messaging/topology.go, internal/platform/messaging/rabbitmq.go, docker-compose.yml]

object_storage:
  - name: local-object-store
    endpoint: filesystem-backed local object store
    owner: auth
    purposes: KYC documents and privacy exports
    first_deployment: mock/local-only
    durability: disposable volume only
    data_policy: synthetic documents only
    sources: [internal/objectstore, docker-compose.yml]
  - name: backup-repository
    endpoint: UNKNOWN
    owner: operations
    purposes: encrypted Postgres backups
    first_deployment: false
    durability: operations-managed
    data_policy: no K0 backup contents
    sources: [operations/agents/backup/cmd/backup-agent/main.go, deploy/README.md]

filesystem_volumes:
  - name: postgres-data
    mount: /var/lib/postgresql/data
    owner: postgres
    writable: true
    persistence: local disposable Compose volume
    first_deployment: local-only
    backup: backup-agent in operations profile
    sources: [docker-compose.yml]
  - name: object-store-data
    mount: /data
    owner: auth
    writable: true
    persistence: local disposable Compose volume
    first_deployment: local-only
    backup: no production backup claim
    sources: [docker-compose.yml, internal/objectstore]
  - name: service-certs
    mount: /run/secrets/seev-certs
    owner: platform-security
    writable: false
    persistence: injected secret material
    first_deployment: enabled; per-workload Kubernetes mounts required
    backup: never copy private keys into evidence
    sources: [docker-compose.yml, internal/platform/security/tls, deploy/helm/seev/templates]
  - name: temporary-runtime
    mount: /tmp
    owner: each service
    writable: UNKNOWN
    persistence: ephemeral
    first_deployment: true
    backup: none
    sources: [Dockerfile, services/*/cmd/*, tools/*, operations/*, internal/platform/config]
  - name: observability-storage
    mount: component-specific
    owner: observability
    writable: true
    persistence: deferred optional profile
    first_deployment: false
    backup: K7
    sources: [docker-compose.yml, deploy/observability]
