    database: seev_ledger
    owner: ledger
    app_user: ledger_app
    migration_user: seev
    migrations_path: services/ledger/migrations
    migration_count_at_baseline: 37
    retention_policy: config/data-retention.yaml owner ledger
    backup_policy: physical/logical backup through backup-agent; recovery proof is K7 operations
    extensions: pgcrypto-or-current-init
