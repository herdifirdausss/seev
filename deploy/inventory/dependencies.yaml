version: 1
baseline_commit: ff21bf186f95431a386b339ee3a1409e49a7e1b0
call_policy:
  service_to_service: mTLS for HTTP and gRPC; identity is recorded in mtls-identity-matrix.md
  database: only the owning service writes its PostgreSQL database
  readiness: dependency checks are bounded and fail closed for money-moving paths
calls:
  - name: gateway-to-ledger-grpc
    caller: gateway
    target: ledger
    protocol: grpc
    port: 9091
    identity: spiffe://seev.local/ns/seev/sa/gateway
    timeout: 3s
    retry: bounded-idempotent-only
    failure_posture: return dependency error; do not double-submit
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/gateway/cmd/gateway/main.go, contracts/clients/ledger]
  - name: gateway-to-ledger-http
    caller: gateway
    target: ledger
    protocol: https
    port: 8091
    identity: spiffe://seev.local/ns/seev/sa/gateway
    timeout: 3s
    retry: bounded-idempotent-only
    failure_posture: return dependency error
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/gateway/cmd/gateway/main.go, services/gateway/internal/transport/http]
  - name: gateway-to-payin-grpc
    caller: gateway
    target: payin
    protocol: grpc
    port: 9092
    identity: spiffe://seev.local/ns/seev/sa/gateway
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: return dependency error
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/gateway/cmd/gateway/main.go, gen/go/payin/v1]
  - name: gateway-to-payout-grpc
    caller: gateway
    target: payout
    protocol: grpc
    port: 9093
    identity: spiffe://seev.local/ns/seev/sa/gateway
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: return dependency error
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/gateway/cmd/gateway/main.go, gen/go/payout/v1]

  - name: auth-to-ledger-grpc
    caller: auth
    target: ledger
    protocol: grpc
    port: 9091
    identity: spiffe://seev.local/ns/seev/sa/auth
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: fail authentication-dependent workflow closed
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/auth/cmd/auth/main.go, services/auth]
  - name: auth-to-ledger-http
    caller: auth
    target: ledger
    protocol: https
    port: 8091
    identity: spiffe://seev.local/ns/seev/sa/auth
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: fail closed
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/auth/cmd/auth/main.go, services/auth]
  - name: auth-to-payin
    caller: auth
    target: payin
    protocol: https
    port: 8092
    identity: spiffe://seev.local/ns/seev/sa/auth
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: fail closed
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/auth/cmd/auth/main.go]
  - name: auth-to-payout
    caller: auth
    target: payout
    protocol: https
    port: 8093
    identity: spiffe://seev.local/ns/seev/sa/auth
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: fail closed
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/auth/cmd/auth/main.go]
  - name: auth-to-fraud
    caller: auth
    target: fraud
    protocol: https
    port: 8094
    identity: spiffe://seev.local/ns/seev/sa/auth
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: fail closed
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/auth/cmd/auth/main.go]
  - name: auth-to-gateway
    caller: auth
    target: gateway
    protocol: https
    port: 8081
    identity: spiffe://seev.local/ns/seev/sa/auth
    timeout: 5s
    retry: bounded-idempotent-only
    failure_posture: fail closed
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/auth/cmd/auth/main.go]

  - name: payin-to-ledger
    caller: payin
    target: ledger
    protocol: grpc
    port: 9091
    identity: spiffe://seev.local/ns/seev/sa/payin
    timeout: 5s
    retry: idempotency-key-bound
    failure_posture: no completion without ledger result
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/payin/cmd/payin/main.go, services/payin]
  - name: payin-to-fraud
    caller: payin
    target: fraud
    protocol: grpc
    port: 9094
    identity: spiffe://seev.local/ns/seev/sa/payin
    timeout: 5s
    retry: bounded
    failure_posture: fail closed for risk decision
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/payin/cmd/payin/main.go]
  - name: payin-to-vendor
    caller: payin
    target: vendor
    protocol: grpc
    port: 9098
    identity: spiffe://seev.local/ns/seev/sa/payin
    timeout: 5s
    retry: idempotency-key-bound
    failure_posture: pending state and retry/reconciliation
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/payin/cmd/payin/main.go, services/payin]

  - name: payout-to-ledger
    caller: payout
    target: ledger
    protocol: grpc
    port: 9091
    identity: spiffe://seev.local/ns/seev/sa/payout
    timeout: 5s
    retry: idempotency-key-bound
    failure_posture: no completion without ledger result
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/payout/cmd/payout/main.go, services/payout]
  - name: payout-to-fraud
    caller: payout
    target: fraud
    protocol: grpc
    port: 9094
    identity: spiffe://seev.local/ns/seev/sa/payout
    timeout: 5s
    retry: bounded
    failure_posture: fail closed for risk decision
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/payout/cmd/payout/main.go]
  - name: payout-to-vendor
    caller: payout
    target: vendor
    protocol: grpc
    port: 9098
    identity: spiffe://seev.local/ns/seev/sa/payout
    timeout: 5s
    retry: idempotency-key-bound
    failure_posture: pending state and recovery worker
    readiness_class: critical
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/payout/cmd/payout/main.go, services/payout]

  - name: vendor-to-payin
    caller: vendor
    target: payin
    protocol: grpc
    port: 9092
    identity: spiffe://seev.local/ns/seev/sa/vendor
    timeout: 5s
    retry: bounded
    failure_posture: record callback failure for retry
    readiness_class: callback
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/vendor-service/cmd/vendor/main.go]
  - name: vendor-to-payout
    caller: vendor
    target: payout
    protocol: grpc
    port: 9093
    identity: spiffe://seev.local/ns/seev/sa/vendor
    timeout: 5s
    retry: bounded
    failure_posture: record callback failure for retry
    readiness_class: callback
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/vendor-service/cmd/vendor/main.go]

  - name: admin-bff-to-auth
    caller: admin-bff
    target: auth
    protocol: https
    port: 8083
    identity: spiffe://seev.local/ns/seev/sa/admin-bff
    timeout: 5s
    retry: bounded-read-only
    failure_posture: return admin dependency error
    readiness_class: admin
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/adminbff/cmd/adminbff/main.go, services/adminbff]
  - name: admin-bff-to-ledger
    caller: admin-bff
    target: ledger
    protocol: https
    port: 8091
    identity: spiffe://seev.local/ns/seev/sa/admin-bff
    timeout: 5s
    retry: bounded-read-only
    failure_posture: return admin dependency error
    readiness_class: admin
    first_deployment: true
