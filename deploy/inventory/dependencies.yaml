  - name: services-to-postgres
    caller: nine application services
    target: postgres
    protocol: postgresql
    port: 5432
    identity: per-service-database-role
    timeout: config-driven
    retry: bounded-connect
    failure_posture: readiness failure; no cross-owner writes
    readiness_class: critical
    first_deployment: true
    downstream_owner: K2 and K5
    sources: [internal/platform/config, scripts/postgres-init, migrations]
  - name: services-to-redis
    caller: nine application services
    target: redis
    protocol: redis
    port: 6379
    identity: shared-local-credential-or-network-policy
    timeout: config-driven
    retry: bounded
    failure_posture: feature-specific degradation; money paths fail closed
    readiness_class: critical
    first_deployment: true
    downstream_owner: K2 and K5
    sources: [internal/platform/config, internal/platform/cache]
  - name: services-to-rabbitmq
    caller: ledger, fraud, gateway
    target: rabbitmq
    protocol: amqp
    port: 5672
    identity: broker-user
    timeout: config-driven
    retry: publisher-confirms-and-consumer-retry
    failure_posture: durable outbox or retry; no silent loss
    readiness_class: critical
    first_deployment: true
    downstream_owner: K2 and K5
    sources: [internal/platform/messaging, docker-compose.yml]
  - name: services-to-dns
    caller: all application services
    target: cluster-dns
    protocol: dns
    port: 53
    identity: pod-resolver
    timeout: 2s
    retry: bounded
    failure_posture: readiness or vendor lookup failure
    readiness_class: platform
    first_deployment: true
    downstream_owner: K2 and K5
    sources: [docker-compose.yml, deploy/helm/seev]
  - name: vendor-to-egress-proxy
    caller: vendor
    target: squid
    protocol: http-connect
    port: 3128
    identity: vendor-service
    timeout: config-driven
    retry: bounded
    failure_posture: fail closed; direct fallback disabled
    readiness_class: vendor
    first_deployment: false
    downstream_owner: K6
    sources: [internal/platform/resilience/egressproxy, deploy/kubernetes/squid]
  - name: services-to-telemetry
    caller: all application services
    target: telemetry-collector
    protocol: otlp-or-prometheus
    port: UNKNOWN
    identity: service-identity
    timeout: config-driven
    retry: non-blocking
    failure_posture: business request remains available; telemetry is dropped or buffered
    readiness_class: optional
    first_deployment: false
    downstream_owner: K7 observability
    sources: [internal/telemetry, docker-compose.yml]
  - name: vendor-to-real-provider
    caller: vendor
    target: real-vendor-provider
    protocol: https
    port: 443
    identity: vendor-service
    timeout: UNKNOWN
    retry: UNKNOWN
    failure_posture: blocked until vendor certification and hostname allowlist
    readiness_class: deferred
    first_deployment: false
    downstream_owner: K6 and vendor-integration owner
    sources: [services/vendor-service, docs/deployment/vendor-network-matrix.md]
