  - name: assurance-to-ledger
    caller: assurance
    target: ledger
    protocol: grpc
    port: 9091
    identity: spiffe://seev.local/ns/seev/sa/assurance
    timeout: 5s
    retry: bounded-read-only
    failure_posture: mark correlation pending
    readiness_class: audit
    first_deployment: true
    downstream_owner: K3 and K5
    sources: [services/assurance/cmd/assurance/main.go]
  - name: assurance-to-payin
    caller: assurance
    target: payin
    protocol: grpc
    port: 9092
    identity: spiffe://seev.local/ns/seev/sa/assurance
    timeout: 5s
