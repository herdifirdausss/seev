  - name: postgres
    service: postgres
    port: 5432
    protocol: postgresql
    transport: tcp
    bind: 0.0.0.0
    host_bind: 127.0.0.1:5433
    tls: local-compose-default
    mtls: false
    authentication: database-role-and-password
    exposure_class: DATA_PRIVATE
    downstream_owner: K2 data dependency and K5 allowlist
    sources: [docker-compose.yml, scripts/postgres-init]
  - name: redis
    service: redis
    port: 6379
    protocol: redis
    transport: tcp
    bind: 0.0.0.0
    host_bind: 127.0.0.1:6380
    tls: local-compose-default
    mtls: false
    authentication: optional-local-password
    exposure_class: DATA_PRIVATE
    downstream_owner: K2 data dependency and K5 allowlist
    sources: [docker-compose.yml, internal/platform/config]
  - name: rabbitmq-amqp
    service: rabbitmq
    port: 5672
