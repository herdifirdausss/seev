version: 1
baseline_commit: ff21bf186f95431a386b339ee3a1409e49a7e1b0
listener_policy:
  container_bind: 0.0.0.0 is the current Docker default; Kubernetes exposure is controlled by Service and Ingress
  host_bind: local Compose publishes only to loopback unless docker-compose.yml says otherwise
  public_health_metrics: false
listeners:
  - name: gateway-public-http
    service: gateway
    port: 8080
    protocol: http
    transport: tcp
    bind: 0.0.0.0
    host_bind: 127.0.0.1:8080
    tls: terminated-at-edge
    mtls: false
    authentication: bearer-or-public-route-policy
    exposure_class: PUBLIC_EDGE
    downstream_owner: K4 edge routing and rate limits
    sources: [docker-compose.yml, services/gateway/cmd/gateway/main.go, services/gateway/internal/transport/http/router.go]
  - name: gateway-internal-https
    service: gateway
    port: 8081
    protocol: https
    transport: tcp
    bind: 0.0.0.0
    host_bind: 127.0.0.1:8081
    tls: service-leaf
    mtls: true
    authentication: mTLS-and-service-auth
    exposure_class: INTERNAL_HTTP
    downstream_owner: K3 service wiring and K5 NetworkPolicy
    sources: [docker-compose.yml, services/gateway/cmd/gateway/main.go]

  - name: auth-public-http
    service: auth
    port: 8082
    protocol: http
    transport: tcp
    bind: 0.0.0.0
    host_bind: 127.0.0.1:8082
    tls: terminated-at-edge
    mtls: false
    authentication: public-auth-route-policy
    exposure_class: PUBLIC_EDGE
    downstream_owner: K4 edge routing and rate limits
    sources: [docker-compose.yml, services/auth/cmd/auth/main.go, services/auth]
  - name: auth-internal-https
    service: auth
    port: 8083
    protocol: https
    transport: tcp
    bind: 0.0.0.0
    host_bind: 127.0.0.1:8083
