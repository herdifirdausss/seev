                required: true
                content: {application/json: {schema: {$ref: {type: object, additionalProperties: true, description: Operation-specific request schemas tighten this shape; this shared fallback is not a permission to accept unknown fields.}}, examples: {settled: {value: {type: payment.settled, reference: synthetic-reference-001, amount_minor: '125000', currency: IDR}}}}}
