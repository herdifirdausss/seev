 {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, details: {type: object, additionalProperties: true}}}}}}}}}}}, '503': {$ref: {description: A dependency is temporarily unavailable., content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, details: {type: object, additionalProperties: true}}}}}}}}}}}}
