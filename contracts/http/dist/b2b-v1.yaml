components:
    securitySchemes:
        merchantApiKey: {$ref: {type: http, scheme: bearer, description: "Merchant/B2B API key (Plan 57 §3.2 — a distinct machine identity, not an AuthService user/JWT). Wire format is a bearer token (`sk_test_<prefix>_<secret>` / `sk_live_<prefix>_<secret>`) but the scheme is named separately from bearerAuth so contract tooling and code review can tell the two principals apart at a glance."}}
    schemas:
        # Opaque public IDs (§6.5) — new merchant-edge resources get an opaque
        # prefixed ID; existing owner-service resources (accounts, transactions,
        # payins, payouts) keep their established UUID form.
        MerchantID: {type: string, pattern: '^mrc_[a-zA-Z0-9]{16,32}$', examples: [mrc_9f2c1a7b4e6d0813]}
        ApiKeyID: {type: string, pattern: '^key_[a-zA-Z0-9]{16,32}$', examples: [key_3b8e0f1c2a9d4756]}
        WebhookEventID: {type: string, pattern: '^evt_[a-zA-Z0-9]{16,32}$', examples: [evt_7a1d9c3e5f0b2846]}
        WebhookEndpointID: {type: string, pattern: '^wh_[a-zA-Z0-9]{16,32}$', examples: [wh_4c2e8a0d1f9b3657]}
        WebhookDeliveryID: {type: string, pattern: '^wd_[a-zA-Z0-9]{16,32}$', examples: [wd_1e9b4d7a0c3f8265]}
        CreateTransferRequest:
            type: object
            required: [destination_account_id, amount, currency]
            additionalProperties: false
            properties:
                destination_account_id: {$ref: {type: string, format: uuid, examples: ['00000000-0000-7000-8000-000000000001']}}
                amount: {$ref: {type: string, pattern: '^[0-9]+$', description: Non-negative integer amount in currency minor units; never a floating-point JSON number., examples: ['125000']}}
                currency: {$ref: {type: string, pattern: '^[A-Z]{3}$', examples: [IDR]}}
                reference_id: {type: string, maxLength: 128}
                metadata: {type: object, additionalProperties: true}
            description: >-
                The source account is inferred from the authenticated tenant and may not be supplied by the caller (§6.4).
        CreatePayinRequest:
            type: object
            required: [amount, currency]
            additionalProperties: false
            properties:
                amount: {$ref: {type: string, pattern: '^[0-9]+$', description: Non-negative integer amount in currency minor units; never a floating-point JSON number., examples: ['125000']}}
                currency: {$ref: {type: string, pattern: '^[A-Z]{3}$', examples: [IDR]}}
                reference_id: {type: string, maxLength: 128}
                metadata: {type: object, additionalProperties: true}
        CreatePayoutRequest:
            type: object
            required: [amount, currency, destination]
            additionalProperties: false
            properties:
                amount: {$ref: {type: string, pattern: '^[0-9]+$', description: Non-negative integer amount in currency minor units; never a floating-point JSON number., examples: ['125000']}}
                currency: {$ref: {type: string, pattern: '^[A-Z]{3}$', examples: [IDR]}}
                destination:
                    type: object
                    description: Owner-service-resolved payout destination descriptor (T6 defines the exact shape against PayoutService's existing contract).
                    additionalProperties: true
                reference_id: {type: string, maxLength: 128}
                metadata: {type: object, additionalProperties: true}
        WebhookEventType:
            type: string
            enum: [transaction.posted.v1, transaction.reversed.v1, payin.updated.v1, payout.updated.v1, webhook.endpoint.disabled.v1]
        CreateWebhookEndpointRequest:
            type: object
            required: [url, events]
            additionalProperties: false
            properties:
                url: {type: string, format: uri, maxLength: 2048}
                events: {type: array, minItems: 1, items: {$ref: {type: string, enum: [transaction.posted.v1, transaction.reversed.v1, payin.updated.v1, payout.updated.v1, webhook.endpoint.disabled.v1]}}}
                description: {type: string, maxLength: 256}
        UpdateWebhookEndpointRequest:
            type: object
            additionalProperties: false
            properties:
                url: {type: string, format: uri, maxLength: 2048}
                events: {type: array, minItems: 1, items: {$ref: {type: string, enum: [transaction.posted.v1, transaction.reversed.v1, payin.updated.v1, payout.updated.v1, webhook.endpoint.disabled.v1]}}}
                description: {type: string, maxLength: 256}
                status: {type: string, enum: [enabled, disabled]}
    responses:
        # Every B2B response reuses the repo-wide SuccessEnvelope/ErrorEnvelope
        # (contracts/http/components/common.yaml) — no forked envelope shape (T1
        # "lock error envelope" is satisfied by reuse, not a parallel format).
        # The B2B-specific addition is the three RateLimit-* headers (§6.3),
        # layered on top via a local response variant rather than changing the
        # shared Success/TooManyRequests responses every other contract uses.
        B2BSuccess:
            description: Successful JSON response.
            headers:
                X-Request-ID: {schema: {type: string, minLength: 1, maxLength: 128}}
                RateLimit-Limit: {schema: {type: integer, minimum: 0}}
                RateLimit-Remaining: {schema: {type: integer, minimum: 0}}
                RateLimit-Reset: {schema: {type: integer, minimum: 0}, description: Unix seconds until the current quota window resets.}
            content: {application/json: {schema: {$ref: {type: object, required: [success, data], additionalProperties: false, properties: {success: {const: true}, data: {}, meta: {type: object, additionalProperties: true}}}}}}
        B2BBadRequest: {description: Invalid request, including unknown fields or an invalid/expired pagination cursor.: '', content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}}
        B2BUnauthorized: {description: Missing, invalid: '', expired: '', or revoked API key.: '', content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}}
        B2BForbidden: {description: Scope denied or tenant suspended. Resource existence is never leaked (§6.7)., content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}}
        B2BNotFound: {description: Resource does not exist OR belongs to a different tenant — both return this identical response (§6.7)., content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}}
        B2BConflict: {description: Idempotency key reuse with a different request body, or a replay not allowed in the delivery's current state.: '', content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}}
        B2BUnprocessable: {description: Semantically invalid request (e.g. currency mismatch, insufficient funds).: '', content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}}
        B2BUnavailable: {description: An owner service or a required dependency (quota backend) is temporarily unavailable; the write was fail-closed and NOT applied., content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}}
        B2BTooManyRequests:
            description: Rate limit or quota exceeded.
            headers:
                Retry-After: {schema: {type: integer, minimum: 1}}
                RateLimit-Limit: {schema: {type: integer, minimum: 0}}
                RateLimit-Remaining: {schema: {type: integer, minimum: 0}}
                RateLimit-Reset: {schema: {type: integer, minimum: 0}}
            content: {application/json: {schema: {$ref: {type: object, required: [success, error], additionalProperties: false, properties: {success: {const: false}, error: {$ref: {type: object, required: [code, message], additionalProperties: false, properties: {code: {type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$'}, message: {type: string, minLength: 1, maxLength: 512}, request_id: {type: string, maxLength: 128, description: "Optional, additive (Plan 57 §6.7) — duplicates the X-Request-ID response header inside the error body itself, for programmatic B2B clients that don't always have header access. Every consumer of the pre-existing ErrorEnvelope/Error shape keeps working unchanged since this field is optional."}, details: {type: object, additionalProperties: true}}}}}}}}}
