openapi: 3.1.0
info:
    title: Seev Merchant/B2B API
    version: 1.0.0
    description: >-
        Tenant-isolated merchant API (Plan 57 / roadmap track C1) at the Gateway public edge. Machine principal only — an API key is not an AuthService user (docs/roadmap/active/57-c1-merchant-b2b-api.md §3.2). All money amounts are decimal strings of integer minor units; the API never accepts or emits floating-point money (§3.5). Webhook delivery is at-least-once; receivers must dedupe on the event ID (§3.6).
servers:
    - {url: 'https://api.example.invalid', description: Gateway public edge}
tags:
    - {name: merchant, description: Merchant tenant profile}
    - {name: accounts, description: Merchant ledger accounts and balances}
    - {name: transactions, description: Merchant transaction reads}
    - {name: transfers, description: Merchant-initiated transfers}
    - {name: payins, description: Merchant pay-in journeys}
    - {name: payouts, description: Merchant payout journeys}
    - {name: webhooks, description: Outbound webhook endpoints and deliveries}
paths:
    /api/v1/b2b/merchant:
        get:
            operationId: b2bGetMerchantV1
            tags: [merchant]
            x-see-owner: gateway
            x-see-audience: merchant
            x-see-scopes: ['merchant:read']
            security: [{merchantApiKey: []}]
            parameters: [{$ref: {name: X-Request-ID, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}}]
