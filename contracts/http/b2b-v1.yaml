openapi: 3.1.0
info:
  title: Seev Merchant/B2B API
  version: 1.0.0
  description: >-
    Tenant-isolated merchant API (Plan 57 / roadmap track C1) at the Gateway
    public edge. Machine principal only — an API key is not an AuthService
    user (docs/roadmap/active/57-c1-merchant-b2b-api.md §3.2). All money
    amounts are decimal strings of integer minor units; the API never
    accepts or emits floating-point money (§3.5). Webhook delivery is
    at-least-once; receivers must dedupe on the event ID (§3.6).
servers:
  - {url: https://api.example.invalid, description: Gateway public edge}
tags:
  - {name: merchant, description: Merchant tenant profile}
  - {name: accounts, description: Merchant ledger accounts and balances}
  - {name: transactions, description: Merchant transaction reads}
  - {name: transfers, description: Merchant-initiated transfers}
  - {name: payins, description: Merchant pay-in journeys}
  - {name: payouts, description: Merchant payout journeys}
  - {name: webhooks, description: Outbound webhook endpoints and deliveries}
paths:
  /api/v1/b2b/merchant:
    get:
      operationId: b2bGetMerchantV1
      tags: [merchant]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [merchant:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

  /api/v1/b2b/accounts:
    get:
      operationId: b2bListAccountsV1
      tags: [accounts]
      x-see-owner: gateway
      x-see-behavior-owner: ledger
      x-see-audience: merchant
      x-see-scopes: [accounts:read]
      security: [{merchantApiKey: []}]
      parameters:
        - {$ref: './components/common.yaml#/components/parameters/RequestID'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
  /api/v1/b2b/accounts/{account_id}:
    get:
      operationId: b2bGetAccountV1
      tags: [accounts]
      x-see-owner: gateway
      x-see-behavior-owner: ledger
      x-see-audience: merchant
      x-see-scopes: [accounts:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {$ref: './components/common.yaml#/components/parameters/AccountID'}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
  /api/v1/b2b/accounts/{account_id}/balance:
    get:
      operationId: b2bGetAccountBalanceV1
      tags: [accounts]
      x-see-owner: gateway
      x-see-behavior-owner: ledger
      x-see-audience: merchant
      x-see-scopes: [accounts:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {$ref: './components/common.yaml#/components/parameters/AccountID'}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

  /api/v1/b2b/transactions:
    get:
      operationId: b2bListTransactionsV1
      tags: [transactions]
      x-see-owner: gateway
      x-see-behavior-owner: ledger
      x-see-audience: merchant
      x-see-scopes: [transactions:read]
      security: [{merchantApiKey: []}]
      parameters:
        - {$ref: './components/common.yaml#/components/parameters/RequestID'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '400': {$ref: '#/components/responses/B2BBadRequest'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
  /api/v1/b2b/transactions/{transaction_id}:
    get:
      operationId: b2bGetTransactionV1
      tags: [transactions]
      x-see-owner: gateway
      x-see-behavior-owner: ledger
      x-see-audience: merchant
      x-see-scopes: [transactions:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: transaction_id, in: path, required: true, schema: {$ref: './components/common.yaml#/components/schemas/UUID'}}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

  /api/v1/b2b/transfers:
    post:
      operationId: b2bCreateTransferV1
      tags: [transfers]
      x-see-owner: gateway
      x-see-behavior-owner: ledger
      x-see-audience: merchant
      x-see-scopes: [transfers:write, transactions:read]
      x-idempotent: true
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {$ref: './components/common.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTransferRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/B2BSuccess'}, '400': {$ref: '#/components/responses/B2BBadRequest'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '409': {$ref: '#/components/responses/B2BConflict'}, '422': {$ref: '#/components/responses/B2BUnprocessable'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}, '503': {$ref: '#/components/responses/B2BUnavailable'}}
  /api/v1/b2b/transfers/{transaction_id}:
    get:
      operationId: b2bGetTransferV1
      tags: [transfers]
      x-see-owner: gateway
      x-see-behavior-owner: ledger
      x-see-audience: merchant
      x-see-scopes: [transfers:write, transactions:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: transaction_id, in: path, required: true, schema: {$ref: './components/common.yaml#/components/schemas/UUID'}}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

  /api/v1/b2b/payins:
    post:
      operationId: b2bCreatePayinV1
      tags: [payins]
      x-see-owner: gateway
      x-see-behavior-owner: payin
      x-see-audience: merchant
      x-see-scopes: [payins:write, payins:read]
      x-idempotent: true
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {$ref: './components/common.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePayinRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/B2BSuccess'}, '400': {$ref: '#/components/responses/B2BBadRequest'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '409': {$ref: '#/components/responses/B2BConflict'}, '422': {$ref: '#/components/responses/B2BUnprocessable'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}, '503': {$ref: '#/components/responses/B2BUnavailable'}}
  /api/v1/b2b/payins/{payin_id}:
    get:
      operationId: b2bGetPayinV1
      tags: [payins]
      x-see-owner: gateway
      x-see-behavior-owner: payin
      x-see-audience: merchant
      x-see-scopes: [payins:write, payins:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: payin_id, in: path, required: true, schema: {$ref: './components/common.yaml#/components/schemas/UUID'}}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

  /api/v1/b2b/payouts:
    post:
      operationId: b2bCreatePayoutV1
      tags: [payouts]
      x-see-owner: gateway
      x-see-behavior-owner: payout
      x-see-audience: merchant
      x-see-scopes: [payouts:write, payouts:read]
      x-idempotent: true
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {$ref: './components/common.yaml#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePayoutRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/B2BSuccess'}, '400': {$ref: '#/components/responses/B2BBadRequest'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '409': {$ref: '#/components/responses/B2BConflict'}, '422': {$ref: '#/components/responses/B2BUnprocessable'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}, '503': {$ref: '#/components/responses/B2BUnavailable'}}
  /api/v1/b2b/payouts/{payout_id}:
    get:
      operationId: b2bGetPayoutV1
      tags: [payouts]
      x-see-owner: gateway
      x-see-behavior-owner: payout
      x-see-audience: merchant
      x-see-scopes: [payouts:write, payouts:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: payout_id, in: path, required: true, schema: {$ref: './components/common.yaml#/components/schemas/UUID'}}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

  /api/v1/b2b/webhook-endpoints:
    get:
      operationId: b2bListWebhookEndpointsV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:read]
      security: [{merchantApiKey: []}]
      parameters:
        - {$ref: './components/common.yaml#/components/parameters/RequestID'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
    post:
      operationId: b2bCreateWebhookEndpointV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:write]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateWebhookEndpointRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/B2BSuccess'}, '400': {$ref: '#/components/responses/B2BBadRequest'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '422': {$ref: '#/components/responses/B2BUnprocessable'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
  /api/v1/b2b/webhook-endpoints/{endpoint_id}:
    get:
      operationId: b2bGetWebhookEndpointV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: endpoint_id, in: path, required: true, schema: {$ref: '#/components/schemas/WebhookEndpointID'}}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
    patch:
      operationId: b2bUpdateWebhookEndpointV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:write]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: endpoint_id, in: path, required: true, schema: {$ref: '#/components/schemas/WebhookEndpointID'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateWebhookEndpointRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '400': {$ref: '#/components/responses/B2BBadRequest'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '422': {$ref: '#/components/responses/B2BUnprocessable'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
    delete:
      operationId: b2bDeleteWebhookEndpointV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:write]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: endpoint_id, in: path, required: true, schema: {$ref: '#/components/schemas/WebhookEndpointID'}}]
      responses: {'204': {$ref: './components/common.yaml#/components/responses/NoContent'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
  /api/v1/b2b/webhook-endpoints/{endpoint_id}/rotate:
    post:
      operationId: b2bRotateWebhookEndpointSecretV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:write]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: endpoint_id, in: path, required: true, schema: {$ref: '#/components/schemas/WebhookEndpointID'}}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

  /api/v1/b2b/webhook-deliveries:
    get:
      operationId: b2bListWebhookDeliveriesV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:read]
      security: [{merchantApiKey: []}]
      parameters:
        - {$ref: './components/common.yaml#/components/parameters/RequestID'}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: endpoint_id, in: query, schema: {$ref: '#/components/schemas/WebhookEndpointID'}}
        - {name: status, in: query, schema: {type: string, enum: [pending, delivered, failed, dead]}}
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '400': {$ref: '#/components/responses/B2BBadRequest'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
  /api/v1/b2b/webhook-deliveries/{delivery_id}:
    get:
      operationId: b2bGetWebhookDeliveryV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:read]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: delivery_id, in: path, required: true, schema: {$ref: '#/components/schemas/WebhookDeliveryID'}}]
      responses: {'200': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}
  /api/v1/b2b/webhook-deliveries/{delivery_id}/replay:
    post:
      operationId: b2bReplayWebhookDeliveryV1
      tags: [webhooks]
      x-see-owner: gateway
      x-see-audience: merchant
      x-see-scopes: [webhooks:write]
      security: [{merchantApiKey: []}]
      parameters: [{$ref: './components/common.yaml#/components/parameters/RequestID'}, {name: delivery_id, in: path, required: true, schema: {$ref: '#/components/schemas/WebhookDeliveryID'}}]
      responses: {'201': {$ref: '#/components/responses/B2BSuccess'}, '401': {$ref: '#/components/responses/B2BUnauthorized'}, '403': {$ref: '#/components/responses/B2BForbidden'}, '404': {$ref: '#/components/responses/B2BNotFound'}, '409': {$ref: '#/components/responses/B2BConflict'}, '429': {$ref: '#/components/responses/B2BTooManyRequests'}}

components:
  securitySchemes:
    merchantApiKey: {$ref: './components/common.yaml#/components/securitySchemes/merchantApiKey'}

  schemas:
    # Opaque public IDs (§6.5) — new merchant-edge resources get an opaque
    # prefixed ID; existing owner-service resources (accounts, transactions,
    # payins, payouts) keep their established UUID form.
    MerchantID: {type: string, pattern: '^mrc_[a-zA-Z0-9]{16,32}$', examples: [mrc_9f2c1a7b4e6d0813]}
    ApiKeyID: {type: string, pattern: '^key_[a-zA-Z0-9]{16,32}$', examples: [key_3b8e0f1c2a9d4756]}
    WebhookEventID: {type: string, pattern: '^evt_[a-zA-Z0-9]{16,32}$', examples: [evt_7a1d9c3e5f0b2846]}
    WebhookEndpointID: {type: string, pattern: '^wh_[a-zA-Z0-9]{16,32}$', examples: [wh_4c2e8a0d1f9b3657]}
    WebhookDeliveryID: {type: string, pattern: '^wd_[a-zA-Z0-9]{16,32}$', examples: [wd_1e9b4d7a0c3f8265]}

    CreateTransferRequest:
      type: object
      required: [destination_account_id, amount, currency]
      additionalProperties: false
      properties:
        destination_account_id: {$ref: './components/common.yaml#/components/schemas/UUID'}
        amount: {$ref: './components/common.yaml#/components/schemas/MoneyMinor'}
        currency: {$ref: './components/common.yaml#/components/schemas/Currency'}
        reference_id: {type: string, maxLength: 128}
        metadata: {type: object, additionalProperties: true}
      description: >-
        The source account is inferred from the authenticated tenant and may
        not be supplied by the caller (§6.4).

    CreatePayinRequest:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: {$ref: './components/common.yaml#/components/schemas/MoneyMinor'}
        currency: {$ref: './components/common.yaml#/components/schemas/Currency'}
        reference_id: {type: string, maxLength: 128}
        metadata: {type: object, additionalProperties: true}

    CreatePayoutRequest:
      type: object
      required: [amount, currency, destination]
      additionalProperties: false
      properties:
        amount: {$ref: './components/common.yaml#/components/schemas/MoneyMinor'}
        currency: {$ref: './components/common.yaml#/components/schemas/Currency'}
        destination:
          type: object
          description: Owner-service-resolved payout destination descriptor (T6 defines the exact shape against PayoutService's existing contract).
          additionalProperties: true
        reference_id: {type: string, maxLength: 128}
        metadata: {type: object, additionalProperties: true}

    WebhookEventType:
      type: string
      enum: [transaction.posted.v1, transaction.reversed.v1, payin.updated.v1, payout.updated.v1, webhook.endpoint.disabled.v1]

    CreateWebhookEndpointRequest:
      type: object
      required: [url, events]
      additionalProperties: false
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        events: {type: array, minItems: 1, items: {$ref: '#/components/schemas/WebhookEventType'}}
        description: {type: string, maxLength: 256}

    UpdateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      properties:
        url: {type: string, format: uri, maxLength: 2048}
        events: {type: array, minItems: 1, items: {$ref: '#/components/schemas/WebhookEventType'}}
        description: {type: string, maxLength: 256}
        status: {type: string, enum: [enabled, disabled]}

  responses:
    # Every B2B response reuses the repo-wide SuccessEnvelope/ErrorEnvelope
    # (contracts/http/components/common.yaml) — no forked envelope shape (T1
    # "lock error envelope" is satisfied by reuse, not a parallel format).
    # The B2B-specific addition is the three RateLimit-* headers (§6.3),
    # layered on top via a local response variant rather than changing the
    # shared Success/TooManyRequests responses every other contract uses.
    B2BSuccess:
      description: Successful JSON response.
      headers:
        X-Request-ID: {schema: {type: string, minLength: 1, maxLength: 128}}
        RateLimit-Limit: {schema: {type: integer, minimum: 0}}
        RateLimit-Remaining: {schema: {type: integer, minimum: 0}}
        RateLimit-Reset: {schema: {type: integer, minimum: 0}, description: Unix seconds until the current quota window resets.}
      content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/SuccessEnvelope'}}}
    B2BBadRequest: {description: Invalid request, including unknown fields or an invalid/expired pagination cursor., content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}}
    B2BUnauthorized: {description: Missing, invalid, expired, or revoked API key., content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}}
    B2BForbidden: {description: Scope denied or tenant suspended. Resource existence is never leaked (§6.7)., content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}}
    B2BNotFound: {description: Resource does not exist OR belongs to a different tenant — both return this identical response (§6.7)., content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}}
    B2BConflict: {description: Idempotency key reuse with a different request body, or a replay not allowed in the delivery's current state., content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}}
    B2BUnprocessable: {description: Semantically invalid request (e.g. currency mismatch, insufficient funds)., content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}}
    B2BUnavailable: {description: An owner service or a required dependency (quota backend) is temporarily unavailable; the write was fail-closed and NOT applied., content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}}
    B2BTooManyRequests:
      description: Rate limit or quota exceeded.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
        RateLimit-Limit: {schema: {type: integer, minimum: 0}}
        RateLimit-Remaining: {schema: {type: integer, minimum: 0}}
        RateLimit-Reset: {schema: {type: integer, minimum: 0}}
      content: {application/json: {schema: {$ref: './components/common.yaml#/components/schemas/ErrorEnvelope'}}}
