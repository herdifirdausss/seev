      operationId: authRegisterV1
      tags: [auth]
      servers: [{url: https://auth.example.invalid}]
      x-see-owner: auth
      x-see-audience: public
      security: []
      requestBody: {$ref: './components/common.yaml#/components/requestBodies/JSON'}
      responses: {'201': {$ref: './components/common.yaml#/components/responses/Success'}, '400': {$ref: './components/common.yaml#/components/responses/BadRequest'}, '409': {$ref: './components/common.yaml#/components/responses/Conflict'}, '429': {$ref: './components/common.yaml#/components/responses/TooManyRequests'}}
