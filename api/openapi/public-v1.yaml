openapi: 3.1.0
info:
  title: Seev public user API
  version: 1.0.0
  description: Stable v1 user contract for auth and gateway-owned product journeys.
servers:
  - {url: https://api.example.invalid, description: Gateway public edge}
  - {url: https://auth.example.invalid, description: Auth service public listener}
tags:
  - {name: auth, description: Authentication and user profile}
  - {name: ledger, description: User ledger operations}
  - {name: payments, description: Top-up and payout operations}
  - {name: notifications, description: User notification inbox}
paths:
