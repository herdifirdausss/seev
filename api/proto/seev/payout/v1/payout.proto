syntax = "proto3";

package seev.payout.v1;

import "google/protobuf/timestamp.proto";

service PayoutService {
  rpc HandleVendorCallback(HandleVendorCallbackRequest) returns (HandleVendorCallbackResponse);
  rpc CreatePayout(CreatePayoutRequest) returns (CreatePayoutResponse);
  rpc GetPayout(GetPayoutRequest) returns (GetPayoutResponse);
  // Merchant/B2B (Plan 57, C1) — Gateway-only callers, never a direct
  // merchant-facing RPC. tenant_id/environment come from Gateway's own
  // resolved API-key principal, never a caller-suppliable field once past
  // the B2B HTTP edge.
  rpc CreateMerchantPayout(CreateMerchantPayoutRequest) returns (CreateMerchantPayoutResponse);
  rpc GetMerchantPayout(GetMerchantPayoutRequest) returns (GetMerchantPayoutResponse);
  rpc ListAssuranceRecords(ListAssuranceRecordsRequest) returns (ListAssuranceRecordsResponse);
  rpc GetIntakeControl(GetIntakeControlRequest) returns (GetIntakeControlResponse);
  rpc ApplyIntakeControl(ApplyIntakeControlRequest) returns (ApplyIntakeControlResponse);
}

message CreatePayoutRequest {
  string user_id = 1;
  string amount = 2;
  bytes destination = 3;
  string created_by = 4;
  // quote_id (docs/roadmap/archive/38 Task T5), when set, consumes a fee quote
  // BEFORE the hold is posted (anti-burn ordering) — the fee it locks in
  // is honored at settle time regardless of any later fee_rules change.
  string quote_id = 5;
}

message GetPayoutRequest {
  string id = 1;
  string user_id = 2;
}

message CreatePayoutResponse { Payout payout = 1; }
message GetPayoutResponse { Payout payout = 1; }

message Payout {
  string id = 1;
  string user_id = 2;
  string amount = 3;
  string currency = 4;
  string vendor = 5;
  string status = 6;
  string error_message = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateMerchantPayoutRequest {
  string tenant_id = 1;
  string environment = 2; // sandbox | live
  string currency = 3;
  string amount = 4;
  bytes destination = 5;
  string created_by = 6;
  // downstream_key is Gateway's own idempotency.DownstreamKey for this
  // (tenant, operation, merchant idempotency key) — a Gateway retry
  // (including a Gateway crash after this call already succeeded once)
  // reuses the SAME downstream_key, so the response is the ORIGINAL
  // request, never a second hold (docs/reference/c1-b2b-design.md §10.4).
  string downstream_key = 7;
}

message GetMerchantPayoutRequest {
  string tenant_id = 1;
  string id = 2;
}

message CreateMerchantPayoutResponse { Payout payout = 1; }
message GetMerchantPayoutResponse { Payout payout = 1; }

message HandleVendorCallbackRequest {
  string vendor = 1;
  string vendor_event_id = 2;
  string external_reference = 3;
  string amount = 4;
  string currency = 5;
  string status = 6; // pending | settled | failed
  google.protobuf.Timestamp occurred_at = 7;
  string vendor_inbox_id = 8;
  string request_id = 9;
  string unknown_vendor_status = 10;
}

enum VendorCallbackResult {
  VENDOR_CALLBACK_RESULT_UNSPECIFIED = 0;
  VENDOR_CALLBACK_RESULT_FINALIZED = 1;
  VENDOR_CALLBACK_RESULT_ALREADY_FINALIZED = 2;
  VENDOR_CALLBACK_RESULT_IGNORED_NON_TERMINAL = 3;
  VENDOR_CALLBACK_RESULT_RECORDED_UNMATCHED = 4;
}

message HandleVendorCallbackResponse {
  VendorCallbackResult result = 1;
}

message ListAssuranceRecordsRequest {
  google.protobuf.Timestamp cursor_updated_at = 1;
  string cursor_id = 2;
  google.protobuf.Timestamp cutoff = 3;
  uint32 page_size = 4;
}

message ListAssuranceRecordsResponse {
  repeated AssuranceRecord records = 1;
  google.protobuf.Timestamp next_updated_at = 2;
  string next_id = 3;
  bool has_more = 4;
}

message AssuranceRecord {
  string id = 1;
  google.protobuf.Timestamp effective_updated_at = 2;
  google.protobuf.Timestamp created_at = 3;
  string status = 4;
  string user_id = 5;
  string amount = 6;
  string currency = 7;
  string vendor = 8;
  string hold_tx_id = 9;
  string settle_tx_id = 10;
  string request_id = 11;
  bool request_id_present = 12;
  string fee_quote_id = 13;
  string fee_amount = 14;
  string fee_gateway = 15;
  repeated VendorCallSummary vendor_calls = 16;
  repeated VendorCommandSummary vendor_commands = 17;
}

message VendorCallSummary {
  int32 attempt = 1;
  string vendor = 2;
  string outcome = 3;
  google.protobuf.Timestamp created_at = 4;
}

message VendorCommandSummary {
  string id = 1;
  string vendor = 2;
  int32 attempt = 3;
  string status = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetIntakeControlRequest {}

message GetIntakeControlResponse {
  bool paused = 1;
  int64 revision = 2;
  string updated_by = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ApplyIntakeControlRequest {
  string command_id = 1;
  string action = 2; // pause | resume
  int64 expected_revision = 3;
  string actor = 4;
  string reason = 5;
}

message ApplyIntakeControlResponse {
  bool applied = 1;
  bool paused = 2;
  int64 revision = 3;
}
