rpc:
  - id: fraud.v1.FraudService
    owner: fraud
    package: seev.fraud.v1
    service: FraudService
    version: v1
    audience: internal
    artifact: api/proto/seev/fraud/v1/fraud.proto
    consumers: [auth, ledger, payin, payout]
    methods:
      - Screen
  - id: ledger.v1.LedgerService
    owner: ledger
    package: seev.ledger.v1
    service: LedgerService
    version: v1
    audience: internal
    artifact: api/proto/seev/ledger/v1/ledger.proto
    consumers: [auth, assurance, gateway, payin, payout]
    methods:
      - Post
      - GetTransactionByIdempotencyKey
      - GetUserCurrency
      - ResolveFee
      - ProvisionUser
      - ConsumeFeeQuote
      - ApplyKycTier
      - BatchGetAssuranceTransactions
      - ProvisionMerchant
      - GetMerchantAccount
      - ListMerchantTransactions
      - GetMerchantTransaction
  - id: payin.v1.PayinService
    owner: payin
    package: seev.payin.v1
    service: PayinService
    version: v1
    audience: internal
    artifact: api/proto/seev/payin/v1/payin.proto
    consumers: [assurance, gateway, vendor-service]
    methods:
      - HandleWebhook
      - HandleVendorCallback
      - CreateTopupIntent
      - GetTopupIntent
      - CreateMerchantTopupIntent
      - GetMerchantTopupIntent
      - ListAssuranceRecords
      - GetIntakeControl
      - ApplyIntakeControl
  - id: payout.v1.PayoutService
    owner: payout
    package: seev.payout.v1
    service: PayoutService
    version: v1
    audience: internal
    artifact: api/proto/seev/payout/v1/payout.proto
    consumers: [assurance, gateway, vendor-service]
    methods:
      - CreatePayout
      - HandleVendorCallback
      - GetPayout
      - CreateMerchantPayout
      - GetMerchantPayout
      - ListAssuranceRecords
      - GetIntakeControl
      - ApplyIntakeControl
  - id: vendorservice.v1.VendorService
    owner: vendor
    package: seev.vendorservice.v1
    service: VendorService
    version: v1
    audience: internal
    artifact: api/proto/seev/vendorservice/v1/vendor_service.proto
    consumers: [payin, payout]
    methods:
      - CreatePayinSession
      - SubmitPayout
      - QueryPayout
  - id: ping.v1.PingService
    owner: platform
    package: seev.ping.v1
    service: PingService
    version: v1
    audience: operational
    artifact: api/proto/seev/ping/v1/ping.proto
    consumers: [gateway, assurance, operator]
    methods:
      - Ping

events:
  - id: ledger.transaction.posted.v1
    owner: ledger
    routing_key: ledger.transaction.posted.v1
    schema_version: v1
    artifact: api/events/ledger/transaction-posted/v1.schema.json
    producer: ledger
    consumers: [fraud, notify]
    queues: [ledger.events.fraud, ledger.events.notifications]
    delivery: at-least-once
    ordering: none
    deduplication_key: amqp.message_id
    data_classification: confidential
    lifecycle: active
