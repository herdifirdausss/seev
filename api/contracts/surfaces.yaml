# A9 T0 contract-surface inventory.
#
# This is an inventory of the live registrations, not an OpenAPI document.
# `kind: mount` records a prefix mounted by a parent router; its leaf
# operations are listed in the owning module's registration entries. Keeping
# mounts explicit is important because conditional dependencies and proxies
# otherwise disappear from a source-only route scan.
