name: seev_analytics
version: 1.0.0
config-version: 2

profile: seev_analytics

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
snapshot-paths: [snapshots]
docs-paths: [docs]

# /workspace is a read-only bind mount of this project. target-path/log-path
# are redirected to the container's writable layer via the DBT_TARGET_PATH/
# DBT_LOG_PATH env vars (real dbt CLI global flags, set in compose) instead of
# here, since setting them in dbt_project.yml is deprecated. packages-install-path
# has no such CLI-flag/env-var mapping, so it is set explicitly here instead
# (confirmed 2026-08-05: `dbt deps` otherwise tries to mkdir the relative,
# read-only `dbt_packages`).
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

clean-targets:
  - target
  - dbt_packages

models:
  seev_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: table
    marts:
      +schema: mart
      +materialized: table
    control:
      +schema: control
      +materialized: table

seeds:
  seev_analytics:
    +schema: control
    +quote_columns: false

# control.dbt_invocations exists (analytics/clickhouse/migrations/004-control.sql)
# for plan section 24.4's seev_analytics_dbt_run_total metric, but nothing
# wrote to it (confirmed 2026-08-05) until this hook.
on-run-end:
  - "{{ record_dbt_invocation(results) }}"
