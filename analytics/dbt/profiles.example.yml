seev_analytics:
  target: local
  outputs:
    local:
      type: clickhouse
      schema: core
      host: "{{ env_var('DBT_CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('DBT_CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('DBT_CLICKHOUSE_USER', 'analytics_dbt') }}"
      password: "{{ env_var('DBT_CLICKHOUSE_PASSWORD') }}"
      secure: false
      threads: "{{ env_var('DBT_THREADS', '1') | int }}"
