version: 2

models:
  - name: fact_ledger_entry
    description: "One immutable Ledger entry. Source of truth for financial movement."
    meta: {owner: LedgerService, grain: one_immutable_ledger_entry, money_semantics: signed_integer_minor_units, timestamp_semantics: created_at_utc_and_report_date, sensitivity: restricted_financial}
    columns:
      - {name: id, description: immutable entry identity, tests: [not_null, unique]}
      - {name: transaction_id, description: Ledger transaction relationship, tests: [not_null]}
      - {name: amount_minor, description: positive integer minor units, tests: [not_null]}
      - {name: direction, description: debit or credit, tests: [not_null, accepted_values: {values: [debit, credit]}]}
      - {name: signed_amount_minor, description: credit positive and debit negative, tests: [not_null]}
  - name: fact_ledger_transaction
    description: "One Ledger transaction header, with explicit status and currency semantics."
    meta: {owner: LedgerService, grain: one_ledger_transaction, money_semantics: positive_integer_minor_units, timestamp_semantics: created_at_utc, sensitivity: restricted_financial}
    columns:
      - {name: id, tests: [not_null, unique]}
      - {name: amount_minor, tests: [not_null]}
      - {name: currency, tests: [not_null]}
  - name: fact_fee_quote
    description: "Fee quote intent and conversion state; never recognized revenue."
    meta: {owner: LedgerService, grain: one_fee_quote, money_semantics: quoted_integer_minor_units, timestamp_semantics: created_at_utc, sensitivity: restricted_pricing}
    columns:
      - {name: id, tests: [not_null, unique]}
      - {name: user_pseudonym, description: deterministic non-display pseudonym}
  - name: fact_fee_revenue
    description: "Recognized fee movement from posted Ledger fee-account entries."
    meta: {owner: LedgerService, grain: one_posted_fee_account_entry, money_semantics: signed_integer_minor_units, timestamp_semantics: posted_at_utc, sensitivity: restricted_financial}
    columns:
      - {name: entry_id, tests: [not_null, unique]}
      - {name: recognized_fee_revenue_minor, tests: [not_null]}
  - name: fact_payin_lifecycle
    description: "One Payin intent with safe lifecycle and callback metadata. Payin-to-Ledger is nullable until the owner contract provides a deterministic key."
    meta: {owner: PayinService, grain: one_payin_intent, money_semantics: positive_integer_minor_units, timestamp_semantics: created_at_utc, sensitivity: restricted_payment}
    columns:
      - {name: payin_id, tests: [not_null, unique]}
      - {name: user_pseudonym, description: deterministic non-display pseudonym}
  - name: fact_payout_lifecycle
    description: "One Payout request without destination data and with deterministic Ledger transaction links."
    meta: {owner: PayoutService, grain: one_payout_request, money_semantics: positive_integer_minor_units, timestamp_semantics: created_at_utc, sensitivity: restricted_payment}
    columns:
      - {name: payout_id, tests: [not_null, unique]}
      - {name: hold_tx_id, description: deterministic hold Ledger link}
      - {name: settlement_transaction_id, description: deterministic settlement/release Ledger link}
  - name: fact_provider_attempt
    description: "Safe structured provider-attempt metadata, never request or response bodies."
    meta: {owner: PayoutService, grain: one_safe_provider_attempt, money_semantics: none, timestamp_semantics: started_at_utc, sensitivity: operational}
    columns:
      - {name: attempt_id, tests: [not_null, unique]}
  - name: mart_volume_daily
    description: "Successful processed volume, explicitly not recognized revenue. One currency per row."
    meta: {owner: Analytics, grain: report_date_currency_product, money_semantics: integer_minor_units_per_currency, timestamp_semantics: report_date_Asia_Jakarta, sensitivity: business}
    columns:
      - {name: successful_processed_volume_minor, tests: [not_null]}
  - name: mart_revenue_daily
    description: "Recognized fee revenue reconciled to posted fee-account entries. One currency per row."
    meta: {owner: LedgerService, grain: report_date_currency_product, money_semantics: signed_integer_minor_units_per_currency, timestamp_semantics: report_date_Asia_Jakarta, sensitivity: business}
    columns:
      - {name: recognized_fee_revenue_minor, tests: [not_null]}
  - name: mart_unit_economics_daily
    description: "Modeled contribution margin, not invoiced profitability or net profit."
    meta: {owner: Analytics, grain: report_date_currency_product_vendor, money_semantics: modeled_integer_minor_units_per_currency, timestamp_semantics: report_date_Asia_Jakarta, sensitivity: business}
    columns:
      - {name: cost_basis, tests: [not_null, accepted_values: {values: [modeled, unmodeled]}]}
      - {name: modeled_contribution_margin_minor, tests: [not_null]}
  - name: fact_daily_unit_economics
    description: "Core modeled unit-economics fact. Costs are modeled, not invoiced actuals."
    meta: {owner: Analytics, grain: report_date_currency_product_vendor, money_semantics: modeled_integer_minor_units_per_currency, timestamp_semantics: report_date_Asia_Jakarta, sensitivity: restricted_business}
    columns:
      - {name: report_date, tests: [not_null]}
      - {name: currency, tests: [not_null]}
      - {name: modeled_contribution_margin_minor, tests: [not_null]}
