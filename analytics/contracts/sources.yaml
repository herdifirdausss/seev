    table: payout_vendor_calls
    owner: PayoutService
    primary_key: [id]
    capture_mode: full_row_allowlisted
    classification: provider_attempt_metadata
    retention_class: financial_analytics
    excluded_columns: [req_summary, error]
    columns:
