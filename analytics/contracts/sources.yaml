      - {name: status, action: include, purpose: payout lifecycle status, classification: operational_reference, retention: 24_months, join_behavior: dimension, expected_type: text, nullable: false, transformation: unchanged}
      - {name: hold_tx_id, action: include, purpose: deterministic hold Ledger correlation, classification: financial_identifier, retention: 24_months, join_behavior: exact, expected_type: uuid, nullable: true, transformation: unchanged}
      - {name: settle_tx_id, action: include, purpose: deterministic settlement Ledger correlation, classification: financial_identifier, retention: 24_months, join_behavior: exact, expected_type: uuid, nullable: true, transformation: unchanged}
      - {name: vendor_ref, action: include, purpose: provider reference without payload, classification: operational_identifier, retention: 24_months, join_behavior: exact, expected_type: text, nullable: true, transformation: unchanged}
