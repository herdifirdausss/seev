      - {name: merchant_tenant_id, action: include, purpose: merchant scope without display identity, classification: financial_identifier, retention: 24_months, join_behavior: exact, expected_type: uuid, nullable: false, transformation: unchanged}
      - {name: created_at, action: include, purpose: callback receipt time, classification: operational, retention: 24_months, join_behavior: time, expected_type: timestamptz, nullable: false, transformation: utc}
