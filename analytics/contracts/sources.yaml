    columns:
      - {name: id, action: include, purpose: callback event identity, classification: operational_identifier, retention: 24_months, join_behavior: exact, expected_type: uuid, nullable: false, transformation: unchanged}
      - {name: vendor, action: include, purpose: provider dimension, classification: operational_reference, retention: 24_months, join_behavior: dimension, expected_type: text, nullable: false, transformation: unchanged}
      - {name: vendor_event_id, action: include, purpose: callback dedup identity, classification: operational_identifier, retention: 24_months, join_behavior: exact, expected_type: text, nullable: false, transformation: unchanged}
      - {name: external_ref, action: include, purpose: approved callback correlation, classification: operational_identifier, retention: 24_months, join_behavior: exact, expected_type: text, nullable: false, transformation: unchanged}
