name: Kubernetes deployment validation

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - "deploy/kubernetes/**"
      - "deploy/terraform/**"
      - "deploy/gitops/**"
      - "deploy/policy/**"
      - "deploy/inventory/**"
      - "deploy/observability/prometheus/**"
      - "deploy/backup/**"
      - "deploy/certs/.gitkeep"
      - "docs/deployment/**"
      - "internal/platform/resilience/egressproxy/**"
      - "tools/migrate/**"
      - "tools/certgen/**"
      - "scripts/ci/check-*.sh"
      - ".github/workflows/kubernetes-validate.yml"
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "deploy/kubernetes/**"
      - "deploy/terraform/**"
      - "deploy/gitops/**"
      - "deploy/policy/**"
      - "deploy/inventory/**"
      - "deploy/observability/prometheus/**"
      - "deploy/backup/**"
      - "docs/deployment/**"
      - "internal/platform/resilience/egressproxy/**"
      - "tools/migrate/**"
      - "tools/certgen/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Go version
        id: goversion
        run: echo "version=$(awk '$1 == "go" {print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Test migration and proxy seams
        run: go test ./tools/migrate ./internal/platform/resilience/egressproxy ./internal/platform/config ./services/vendor-service/internal

      - name: Terraform format and validation (DEPLOY-007)
        run: ./scripts/ci/check-iac.sh

      - name: Helm lint through pinned container
        run: |
          HELM_IMAGE='alpine/helm:3.17.3@sha256:d899e6316789fec04ee95300a18e454b7942539cbb3d89bde3e0655d6ca2e895'
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/seev
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/seev -f deploy/helm/seev/values-local.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/seev -f deploy/helm/seev/values-gcp-dev.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/seev -f deploy/helm/seev/values-aws-dev.yaml
          docker run --rm -v "$PWD:/work" -w /work "$HELM_IMAGE" lint deploy/helm/seev -f deploy/helm/seev/values-staging.yaml

      - name: Install helm, kubeconform, conftest (DEPLOY-006)
        run: |
          # helm — same minor version as the Helm lint Docker image above
          HELM_VERSION=v3.17.3
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          # kubeconform — Kubernetes schema validator
          KUBECONFORM_VERSION=v0.6.7
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          # conftest — OPA/Rego policy runner
          CONFTEST_VERSION=0.56.0
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin conftest

      - name: Rendered manifest policy validation (DEPLOY-006)
        run: ./scripts/ci/check-rendered-manifests.sh

      - name: Network contract validation (DEPLOY-001)
        run: ./scripts/ci/check-network-contract.sh

      - name: Staging template remains fail-closed (DEPLOY-002)
        run: |
          if ENV=staging ./scripts/ci/check-deploy-readiness.sh; then
            echo "unresolved staging template unexpectedly passed readiness" >&2
            exit 1
          fi

      - name: Resolved staging promotion readiness fixture (DEPLOY-002)
        env:
          ENV: staging
          VALUES: deploy/helm/seev/values-staging.yaml deploy/helm/seev/testdata/values-staging-resolved.yaml
        run: ./scripts/ci/check-deploy-readiness.sh

      - name: Generate ephemeral mTLS certificates (DEPLOY-004)
        run: make certs

      - name: TLS certificate contract (DEPLOY-004)
        run: ./scripts/ci/check-tls-contract.sh

      - name: Deployment integration contract
        run: ./scripts/ci/check-platform-integration.sh

      - name: Cross-layer drift check (DEPLOY-010)
        run: ./scripts/ci/check-deployment-drift.sh

      - name: Deployment platform E2E contract
        run: ./scripts/platform-e2e.sh

      - name: ShellCheck deployment scripts
        run: |
          command -v shellcheck >/dev/null
          find deploy/kubernetes/scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
          shellcheck --severity=error scripts/ci/check-onboarding-paths.sh
          shellcheck --severity=error scripts/ci/check-iac.sh
          shellcheck --severity=error scripts/ci/check-platform-integration.sh
          shellcheck --severity=error scripts/platform-e2e.sh
          shellcheck --severity=error deploy/kubernetes/scripts/e2e.sh
          shellcheck --severity=error scripts/ci/check-deploy-readiness.sh
          shellcheck --severity=error scripts/ci/check-network-contract.sh
          shellcheck --severity=error scripts/ci/check-deployment-drift.sh
          shellcheck --severity=error scripts/ci/check-rendered-manifests.sh
          shellcheck --severity=error scripts/ci/check-tls-contract.sh
