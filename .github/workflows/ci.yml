name: CI

# docs/roadmap/archive/44 K3: no workflow-level paths-ignore — the workflow ALWAYS
# runs so a required check (`ci-gate`) never goes permanently pending; the
# `changes` job below classifies docs-only vs runtime and the three heavy
# jobs skip themselves via `needs.changes.outputs.runtime`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # docs/roadmap/archive/44 K2: pinned actionlint/ShellCheck release, verified at T0
  # (MIT / GPL-3.0 respectively — see doc 44 T0 Hasil). Bump both here only
  # after re-verifying the new release + license per constraint #8.
  ACTIONLINT_VERSION: "1.7.12"
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  # ─── changes: docs-only classifier (docs/roadmap/archive/44 K3) ───────────────────────
  # Deliberately uses ONLY actions/checkout (official) — no third-party
  # paths-filter action, per K2's allowed-owner list.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify docs-only vs runtime
        id: classify
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="${{ github.event.before }}"
          fi
          HEAD="${{ github.sha }}"

          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable base SHA (new branch / force-push / before=0000...) — treating as runtime, not docs-only"
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "changed files ($BASE..$HEAD):"
          echo "$CHANGED"

          # Runtime the instant ANY changed file falls outside docs/** or is
          # not a *.md file — .github/**, scripts, Compose, Dockerfile,
          # Makefile, Go, SQL, proto all count as runtime/CI per K3.
          if echo "$CHANGED" | grep -qvE '^(docs/.*|.*\.md)$'; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

  docs-check:
    name: docs-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read Go version from go.mod
        id: goversion
        run: echo "version=$(grep -E '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true

      - name: Validate documentation links
        run: make docs-check

      - name: Validate world-class engineering plan index
        run: make improvement-check

      # docs/roadmap/archive/51 K1: config/data-retention.yaml must stay in sync with
      # every migrated table, and docs/data/retention.md must stay in sync
      # with the policy — this is the CI enforcement that closes the loop.
      - name: Validate data retention policy
        run: make retention-check

  # ─── lint-and-test: build/vet, actionlint, ShellCheck, lint, security, unit ──
  lint-and-test:
    name: lint-and-test
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read Go version from go.mod
        id: goversion
        run: echo "version=$(grep -E '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true

      - name: Build all Go packages
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Verify Go modules
        run: go mod verify

      # Downloaded as a pinned release tarball, never `curl | sh` (K2).
      - name: Install actionlint (pinned)
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version

      # ShellCheck 0.9.0 ships on the runner image already; pin the exact
      # release verified at T0 instead, so this check's behavior doesn't
      # silently drift with whatever the runner image happens to bundle.
      - name: Install ShellCheck (pinned)
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: actionlint
        run: actionlint -shellcheck "$(command -v shellcheck)"

      - name: ShellCheck (scripts/**/*.sh, severity=error)
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

      - name: External action SHA-pin policy
        run: ./scripts/ci/check-action-pins.sh

      - name: Supply-chain source controls
        run: ./scripts/ci/supply-chain-check.sh

      - name: Supply-chain evidence verifier E2E
        run: ./scripts/ci/supply-chain-e2e.sh

      # Makefile's GOLANGCI_LINT_VERSION/GOVULNCHECK_VERSION are the single
      # source of truth for these two pins — read them here instead of
      # hardcoding a second copy in this workflow, so bumping the Makefile
      # var is the only place a version bump has to happen.
      - name: Read pinned tool versions from Makefile
        id: toolversions
        run: |
          set -euo pipefail
          {
            echo "golangci_lint=$(make -s print-golangci-lint-version)"
            echo "govulncheck=$(make -s print-govulncheck-version)"
          } >> "$GITHUB_OUTPUT"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.toolversions.outputs.golangci_lint }}

      - name: Go modernizer check
        run: make modernize-check

      - name: Install govulncheck (pinned)
        run: go install "golang.org/x/vuln/cmd/govulncheck@${{ steps.toolversions.outputs.govulncheck }}"

      - name: Go vulnerability scan
        run: govulncheck ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Load-tag safety tests
        run: go test -tags=loadtest ./...

      # A9: generate/lint/test the checked-in HTTP contract artifacts in PR CI.
      # Once the base branch contains the bundle baseline, compare against the
      # actual PR base; the bootstrap fallback protects the first merge that
      # introduces the repository's contract baseline.
      - name: API contract gate
        env:
          CONTRACT_MERGE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          make contract-generate contract-lint contract-test
          git diff --exit-code -- contracts/http/dist
          if [ -n "$CONTRACT_MERGE_BASE_REF" ] && git cat-file -e "$CONTRACT_MERGE_BASE_REF:contracts/http/dist/public-v1.yaml" 2>/dev/null; then
            go run ./tools/contractcheck -merge-base-ref "$CONTRACT_MERGE_BASE_REF"
          else
            echo "contract baseline is being bootstrapped; running local baseline compatibility check"
            go run ./tools/contractcheck
          fi

      # A9: keep protobuf compatibility on the same explicit merge-base
      # policy. Buf receives a commit SHA through PROTO_MERGE_BASE_REF rather
      # than silently comparing against whichever local branch happens to be
      # checked out.
      - name: Protobuf contract gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="$PR_BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable event base SHA; protobuf compatibility is not safely comparable"
            exit 1
          fi
          MERGE_BASE=""
          MERGE_BASE="$(git merge-base HEAD "$BASE")"
          make tools
          make proto proto-lint
          PROTO_MERGE_BASE_REF="$MERGE_BASE" make proto-breaking

      # B0: validate only the disposable harness and schemas in PR CI. This
      # deliberately does not claim a capacity number or start a long load run.
      - name: Load harness safety gate
        run: make load-lint

  # ─── integration: testcontainers-backed integration suite ──────────────────
  integration:
    name: integration
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Keep the integration output even when setup or the test process fails.
      # RUNNER_TEMP is outside the checkout and the upload step below names this
      # exact directory, so the evidence bundle cannot collect repository files
      # or an unrelated runner-temp tree.
      - name: Prepare integration evidence directory
        run: mkdir -p "$RUNNER_TEMP/seev-integration-evidence"

      - name: Read Go version from go.mod
        id: goversion
        run: echo "version=$(grep -E '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true

      # Integration tests use testcontainers-go, which starts its own
      # Postgres container against the Docker daemon already available on
      # GitHub-hosted runners — no separate `services:` container needed.
      - name: Integration tests
        id: integration-tests
        shell: bash
        # internal/auth exercises many testcontainers-backed lifecycle cases;
        # under -race it can legitimately exceed Go's 10-minute default test
        # timeout (the job itself remains bounded by timeout-minutes: 30).
        run: |
          set -uo pipefail
          set +e
          go test -json -tags=integration -race -timeout 25m ./... \
            | tee "$RUNNER_TEMP/seev-integration-evidence/go-test.jsonl"
          statuses=("${PIPESTATUS[@]}")
          test_status="${statuses[0]}"
          tee_status="${statuses[1]}"
          printf 'test_exit_code=%s\ntee_exit_code=%s\n' "$test_status" "$tee_status" \
            >"$RUNNER_TEMP/seev-integration-evidence/test-exit-code.txt"
          set -e
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          exit "$tee_status"

      - name: Write integration evidence manifest
        if: always()
        env:
          SEEV_EVIDENCE_KIND: integration
          SEEV_EVIDENCE_SUITE: go-test-integration-race
          SEEV_EVIDENCE_OUTCOME: ${{ steps.integration-tests.outcome || 'not-started' }}
          SEEV_EVIDENCE_RETENTION_DAYS: "30"
        run: ./scripts/ci/write-critical-failure-manifest.sh "$RUNNER_TEMP/seev-integration-evidence"

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seev-integration-evidence/
          retention-days: 30
          if-no-files-found: warn

  # ─── smoke-container: full-container round-trip (docs/roadmap/archive/44 K4/K5) ───────
  # Nine images built ONCE via a single Bake invocation (reads the build
  # config straight out of docker-compose.yml — no separate Bake file, K5),
  # cached via the GHA backend, loaded into the daemon; smoke-container.sh
  # then runs with --no-build against exactly those loaded images. The same
  # loaded images are vulnerability-scanned and have SBOM files retained.
  smoke-container:
    name: smoke-container
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SEEV_IMAGE_TAG: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # docs/roadmap/archive/49 K3: smoke-container.sh now runs `make certs` (builds
      # tools/certgen with the host Go toolchain) before compose starts any
      # app-profile container, since every one of them mounts the mTLS
      # cert directory this step produces.
      - name: Read Go version from go.mod
        id: goversion
        run: echo "version=$(grep -E '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ten images (Bake, GHA cache, load into daemon)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: docker-compose.yml
          targets: |
            postgres
            auth-service
            fraud-service
            gateway-service
            ledger-service
            payin-service
            payout-service
            admin-bff-service
            assurance-service
            vendor-service
          load: true
          set: |
            *.args.REVISION=${{ github.sha }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # K5: prove every loaded image is a real, non-empty image built from
      # THIS commit — not a stale cache hit silently reused from a
      # different revision, and not an accidental no-op.
      - name: Verify image revision labels
        run: |
          set -euo pipefail
          for svc in auth-service fraud-service gateway-service ledger-service payin-service payout-service admin-bff-service assurance-service vendor-service; do
            image="seev/${svc}:ci"
            id="$(docker image inspect "$image" --format '{{.Id}}')"
            rev="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            if [ -z "$id" ]; then
              echo "::error::$image has an empty image ID"
              exit 1
            fi
            if [ "$rev" != "${{ github.sha }}" ]; then
              echo "::error::$image revision label '$rev' does not match commit ${{ github.sha }}"
              exit 1
            fi
            echo "$image: id=$id revision=$rev OK"
          done

      - name: Prepare container-scan evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seev-container-scan"
          {
            echo "schema=seev.container-scan.v1"
            echo "commit=${{ github.sha }}"
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_attempt=${{ github.run_attempt }}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$RUNNER_TEMP/seev-container-scan/run-manifest.txt"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: true

      - name: Scan loaded service images and generate SBOMs
        id: container-scan
        if: always()
        continue-on-error: true
        run: |
          set -u
          evidence_dir="$RUNNER_TEMP/seev-container-scan"
          scan_status=0
          for svc in auth-service fraud-service gateway-service ledger-service payin-service payout-service admin-bff-service assurance-service vendor-service; do
            image="seev/${svc}:ci"
            report="$evidence_dir/${svc}-trivy.json"
            sbom="$evidence_dir/${svc}-sbom.cdx.json"

            if ! trivy image \
              --format json \
              --output "$report" \
              --severity HIGH,CRITICAL \
              --pkg-types os,library \
              --no-progress \
              --exit-code 1 \
              "$image"; then
              scan_status=1
            fi

            if ! trivy image \
              --format cyclonedx \
              --output "$sbom" \
              --pkg-types os,library \
              --no-progress \
              "$image"; then
              scan_status=1
            fi
          done
          exit "$scan_status"

      - name: Run smoke-container (pre-loaded images, --no-build)
        env:
          SEEV_SMOKE_NO_BUILD: "1"
        run: make smoke-container

      - name: Enforce container scan gate
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.container-scan.outcome }}" != "success" ]; then
            echo "::error::HIGH/CRITICAL container vulnerability scan or SBOM generation failed"
            exit 1
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-container-diagnostics
          path: .smoke-container-artifacts/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload container scan and SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seev-container-scan/
          retention-days: 30
          if-no-files-found: warn

  # ─── ci-gate: the ONE required check (docs/roadmap/archive/44 K3) ─────────────────────
  ci-gate:
    name: ci-gate
    needs: [changes, docs-check, lint-and-test, integration, smoke-container]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate gate
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }} (runtime=${{ needs.changes.outputs.runtime }})"
          echo "docs-check: ${{ needs.docs-check.result }}"
          echo "lint-and-test: ${{ needs.lint-and-test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "smoke-container: ${{ needs.smoke-container.result }}"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes job did not succeed"
            exit 1
          fi

          if [ "${{ needs.docs-check.result }}" != "success" ]; then
            echo "::error::documentation validation did not succeed"
            exit 1
          fi

          if [ "${{ needs.changes.outputs.runtime }}" = "false" ]; then
            # docs-only: the three heavy jobs must have been skipped, not
            # failed/cancelled/silently absent.
            for r in "${{ needs.lint-and-test.result }}" "${{ needs.integration.result }}" "${{ needs.smoke-container.result }}"; do
              if [ "$r" != "skipped" ]; then
                echo "::error::docs-only PR but a heavy job result was '$r', expected 'skipped'"
                exit 1
              fi
            done
            echo "docs-only change: three heavy jobs correctly skipped — gate green"
            exit 0
          fi

          for r in "${{ needs.lint-and-test.result }}" "${{ needs.integration.result }}" "${{ needs.smoke-container.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a heavy job result was '$r', expected 'success'"
              exit 1
            fi
          done
          echo "all gates green"
