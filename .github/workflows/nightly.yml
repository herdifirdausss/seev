name: Scheduled Full-Stack

# docs/roadmap/archive/44 K7: the file name stays "nightly.yml" (easy to find/grep for)
# but the AUTOMATIC schedule is weekly, not nightly — K1's cost budget
# forbids a daily 90-minute gate on a private repo. `workflow_dispatch`
# lets an operator run any subset on demand; the schedule always runs the
# full "all" (business E2E, capability E2E, privacy E2E, then chaos-all, one job, one runner — GitHub-
# hosted jobs never share a VM, so splitting this across `needs:` jobs
# would silently lose Docker/process state between them, per K7).
on:
  schedule:
    # Monday 02:17 WIB = Sunday 19:17 UTC. Off-the-hour minute (K1) to
    # avoid the top-of-hour scheduling rush; always runs "all".
    - cron: "17 19 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite(s) to run"
        type: choice
        options:
          - all
          - business
          - capability
          - privacy
          - chaos
        default: all

permissions:
  contents: read

concurrency:
  # Fixed group (not per-ref) — a manual run must never silently cancel a
  # scheduled run that's mid-way through collecting evidence, or vice
  # versa; they queue instead (K3's cancel-in-progress: true pattern is
  # deliberately NOT used here).
  group: scheduled-full-stack
  cancel-in-progress: false

jobs:
  full-stack:
    name: full-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SUITE: ${{ github.event_name == 'schedule' && 'all' || inputs.suite }}
      KEEP_WORK_DIR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # `runner.temp` is not a valid expression context inside job-level
      # `env:` (only available once a step actually runs on the assigned
      # runner) — compute both exact work-dir paths here instead, via the
      # equivalent $RUNNER_TEMP shell variable GitHub sets on every runner,
      # and hand them to later steps through $GITHUB_ENV like any other
      # workflow-scoped value.
      - name: Compute work-dir paths
        run: |
          {
            echo "BUSINESS_WORK_DIR=$RUNNER_TEMP/seev-business-e2e"
            echo "CAPABILITY_WORK_DIR=$RUNNER_TEMP/seev-capability-e2e"
            echo "PRIVACY_WORK_DIR=$RUNNER_TEMP/seev-privacy-e2e"
            echo "CHAOS_WORK_DIR=$RUNNER_TEMP/seev-chaos"
            echo "EVIDENCE_WORK_DIR=$RUNNER_TEMP/seev-scheduled-full-stack-evidence"
          } >> "$GITHUB_ENV"

      # docs/roadmap/archive/44 K6: generated fresh per run, masked BEFORE landing in
      # $GITHUB_ENV so no step output/log can ever print the raw value.
      - name: Generate per-run credentials
        run: |
          set -euo pipefail
          JWT_SECRET="$(openssl rand -hex 32)"
          INTERNAL_GRPC_TOKEN="$(openssl rand -hex 32)"
          VENDOR_MOCKVENDOR_SECRET="$(openssl rand -hex 32)"
          MOCKVENDOR2_SECRET="$(openssl rand -hex 32)"
          AUTH_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 16)"

          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$INTERNAL_GRPC_TOKEN"
          echo "::add-mask::$VENDOR_MOCKVENDOR_SECRET"
          echo "::add-mask::$MOCKVENDOR2_SECRET"
          echo "::add-mask::$AUTH_BOOTSTRAP_ADMIN_PASSWORD"

          {
            echo "JWT_SECRET=$JWT_SECRET"
            echo "INTERNAL_GRPC_TOKEN=$INTERNAL_GRPC_TOKEN"
            echo "VENDOR_MOCKVENDOR_SECRET=$VENDOR_MOCKVENDOR_SECRET"
            echo "MOCKVENDOR2_SECRET=$MOCKVENDOR2_SECRET"
            echo "AUTH_BOOTSTRAP_ADMIN_PASSWORD=$AUTH_BOOTSTRAP_ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Business E2E
        id: business
        if: env.SUITE == 'business' || env.SUITE == 'all'
        continue-on-error: true
        env:
          SEEV_WORK_DIR: ${{ env.BUSINESS_WORK_DIR }}
        run: |
          docker compose down -v --remove-orphans
          ./scripts/business-e2e.sh

      - name: Reset volume between suites
        if: always() && (env.SUITE == 'capability' || env.SUITE == 'privacy' || env.SUITE == 'chaos' || env.SUITE == 'all')
        run: docker compose down -v --remove-orphans

      - name: Capability E2E
        id: capability
        if: env.SUITE == 'capability' || env.SUITE == 'all'
        continue-on-error: true
        env:
          SEEV_WORK_DIR: ${{ env.CAPABILITY_WORK_DIR }}
        run: make capability-e2e

      - name: Reset volume before privacy
        if: always() && (env.SUITE == 'privacy' || env.SUITE == 'chaos' || env.SUITE == 'all')
        run: docker compose down -v --remove-orphans

      - name: Privacy E2E
        id: privacy
        if: env.SUITE == 'privacy' || env.SUITE == 'all'
        continue-on-error: true
        env:
          SEEV_WORK_DIR: ${{ env.PRIVACY_WORK_DIR }}
        run: make privacy-e2e

      - name: Reset volume before chaos
        if: always() && (env.SUITE == 'chaos' || env.SUITE == 'all')
        run: docker compose down -v --remove-orphans

      - name: Chaos (all scenarios)
        id: chaos
        if: env.SUITE == 'chaos' || env.SUITE == 'all'
        continue-on-error: true
        env:
          SEEV_WORK_DIR: ${{ env.CHAOS_WORK_DIR }}
        run: ./scripts/chaos-test.sh all

      # K7: summary built from step OUTCOME (a first-class GitHub Actions
      # concept — success/failure/skipped per step), never by parsing ANSI
      # color codes out of the scripts' own colored PASS/FAIL log lines.
      - name: Write summary
        if: always()
        run: |
          {
            echo "## Scheduled full-stack — suite: \`${SUITE}\`"
            echo ""
            echo "| Suite | Outcome |"
            echo "|---|---|"
            echo "| business-e2e | ${{ steps.business.outcome || '_skipped_' }} |"
            echo "| capability-e2e | ${{ steps.capability.outcome || '_skipped_' }} |"
            echo "| privacy-e2e | ${{ steps.privacy.outcome || '_skipped_' }} |"
            echo "| chaos-all | ${{ steps.chaos.outcome || '_skipped_' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Build a safe, run-specific package before the work directories are
      # discarded by the runner. The packager copies only top-level logs and
      # result text; binaries, PIDs, certificates/private keys, encrypted
      # objects, and nested directories never enter the upload path.
      - name: Package scheduled critical-failure evidence
        if: always()
        env:
          SEEV_EVIDENCE_KIND: scheduled-full-stack
          SEEV_EVIDENCE_SUITE: ${{ env.SUITE }}
          SEEV_EVIDENCE_OUTCOME_BUSINESS: ${{ steps.business.outcome || 'skipped' }}
          SEEV_EVIDENCE_OUTCOME_CAPABILITY: ${{ steps.capability.outcome || 'skipped' }}
          SEEV_EVIDENCE_OUTCOME_PRIVACY: ${{ steps.privacy.outcome || 'skipped' }}
          SEEV_EVIDENCE_OUTCOME_CHAOS: ${{ steps.chaos.outcome || 'skipped' }}
          SEEV_EVIDENCE_RETENTION_DAYS: "30"
        run: |
          ./scripts/ci/package-critical-failure-evidence.sh \
            "$EVIDENCE_WORK_DIR" \
            business "$BUSINESS_WORK_DIR" \
            capability "$CAPABILITY_WORK_DIR" \
            privacy "$PRIVACY_WORK_DIR" \
            chaos "$CHAOS_WORK_DIR"

      - name: Final cleanup
        if: always()
        run: docker compose down -v --remove-orphans

      # Upload on success as well as failure: a green run is the retained
      # runtime evidence needed to compare later failures against a known-good
      # commit. The artifact name includes run and attempt IDs so reruns are
      # independently addressable.
      - name: Upload scheduled full-stack evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-full-stack-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_WORK_DIR }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Fail the job if a selected suite failed
        if: steps.business.outcome == 'failure' || steps.capability.outcome == 'failure' || steps.privacy.outcome == 'failure' || steps.chaos.outcome == 'failure'
        run: |
          echo "::error::one or more selected suites failed — see summary and scheduled evidence artifact"
          exit 1
