# Track A8 (docs/roadmap/archive/51) K1 — the single, version-controlled source of
# truth for data retention, classification, and purge/redact behavior. Each
# service loads only its own `owner: <service>` entries at runtime and
# rejects unknown actions, negative durations, duplicate `class` ids, and any
# entry that targets a table listed in `permanent_tables` below.
#
# This file is generated evidence, not a legal claim: retention periods here
# are conservative engineering defaults for this learning repository, not an
# approved jurisdiction/product policy (see docs/roadmap/archive/51-a8-data-lifecycle-privacy.md
# §3 "Out of scope"). `docs/data/retention.md` is generated from this file —
# do not hand-edit that file; regenerate it (T0.4) after any change here.
#
# Schema: config/data-retention.schema.json. CI (cmd/retentioncheck, added in
# T0.5) fails the build when a migration creates a table absent from
# `entries[].table` below (excluding `schema_migrations_*`, which is
# migration tooling, not application data), or when an entry targets a
# `permanent_tables` entry with a non-retain action.

policy_version: 1

classifications:
  - public       # no restriction; safe in logs/metrics
  - internal     # operational/system data, not directly personal
  - personal     # identifies or is linked to a natural person (name, email, operator identity)
  - sensitive    # personal + materially damaging if leaked (KYC payload, webhook body, bank destination)
  - financial    # monetary amounts, balances, currency, fee data
  - secret       # credentials/tokens; must never be logged or exported in the clear

actions:
  - retain_permanent      # permanent financial/audit evidence; never age-purged (may still be pseudonymized on closure, K10/K11)
  - retain_immutable      # database-trigger-enforced immutable; app code cannot delete even if it wanted to
  - retain_state          # live configuration/current-state row; no generic age rule applies (K1 §4.2 closing note)
  - delete                # hard delete once eligible and no hold applies
  - redact                # null/replace only the listed sensitive column(s); the row and its non-sensitive columns remain
  - pseudonymize_on_closure # only ever mutated by the T5 account-closure saga; no independent age-based job
  - never_automatic       # eligible in principle but a human operator must resolve/replay first (K1 §4.3)
  - self_replacing        # already has its own full-dataset-replace lifecycle; not an age-based job
  - not_persisted         # in-flight message only; nothing at this layer to retain
  - protected_by_masking  # protected by existing log/trace field masking, not a database retention action
  - expiration_based      # governed by docs/roadmap/archive/50 (A7) backup-chain expiration, not an independent action

# Tables where every row is retained forever — no entry below may ever
# fully DELETE a row from one of these (redact is fine: it nulls a specific
# non-financial column and keeps the row). This is a stricter, row-uniform
# subset of docs/roadmap/archive/51-a8-data-lifecycle-privacy.md §4.1's "permanent
# financial evidence" — assurance_findings is deliberately excluded here even
# though §4.1 covers it, because permanence there applies only to the
# active/acknowledged subset (§4.2 explicitly allows deleting a *resolved*
# finding after 365 days); that row-level distinction is enforced by
# assurance's own SECURITY DEFINER function (K4), not by this table-level
# list. CI rejects any entry below targeting one of these tables with an
# action other than retain_permanent/retain_immutable/retain_state/redact,
# and rejects a migration that adds a DELETE/TRUNCATE grant against any of
# them for a non-owner role.
permanent_tables:
  - ledger.ledger_entries
  - ledger.ledger_transactions
  - ledger.accounts
  - ledger.account_balances
  - ledger.account_balance_snapshots
  - ledger.pending_adjustments
  - payin.payin_topup_intents
  - payout.payout_requests
  - payout.payout_vendor_calls

entries:

  # ── vendor service ───────────────────────────────────────────────────────
  - owner: vendor
    class: vendor.callback_inbox
    table: vendor.vendor_callback_inbox
    classification: sensitive
    terminal_timestamp: updated_at
    duration: 30d
    action: redact
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: "Raw callback bytes are redacted after the investigation window; sanitized correlation fields remain for reconciliation."

  - owner: vendor
    class: vendor.outbound_attempts
    table: vendor.vendor_outbound_attempts
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Append-only sanitized vendor transport audit; plaintext credentials and full vendor payloads are never stored."

  - owner: vendor
    class: vendor.retention_holds
    table: vendor.vendor_retention_holds
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 K5. Same shape/rationale as adminbff.retention_holds."

  - owner: vendor
    class: vendor.retention_audit
    table: vendor.vendor_retention_audit
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 K4. Same shape/rationale as adminbff.retention_audit."

  # ── adminbff ──────────────────────────────────────────────────────────────
  - owner: adminbff
    class: adminbff.sessions
    table: adminbff.sessions
    classification: personal
    terminal_timestamp: "GREATEST(expires_at, absolute_expires_at)"
    duration: 7d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: >
      Matches docs/roadmap/archive/51 §4.2 "Expired admin session". The
      current retention runner invokes fn_retention_purge_sessions every five
      minutes; the database function deletes sessions only after the effective
      expiry is older than seven days.

  - owner: adminbff
    class: adminbff.audit_log
    table: adminbff.audit_log
    classification: personal
    terminal_timestamp: created_at
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Admin audit row'. Never eligible while a hold applies."

  # ── assurance ─────────────────────────────────────────────────────────────
  - owner: assurance
    class: assurance.runs.succeeded
    table: assurance.assurance_runs
    classification: internal
    terminal_timestamp: finished_at
    duration: 90d
    action: delete
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Assurance successful run'. Eligibility requires status='succeeded'."

  - owner: assurance
    class: assurance.runs.failed
    table: assurance.assurance_runs
    classification: internal
    terminal_timestamp: finished_at
    duration: 180d
    action: delete
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Assurance failed run'. Requires status='failed' and an incident/audit summary to already exist (§4.3)."

  - owner: assurance
    class: assurance.incident_summaries
    table: assurance.assurance_incident_summaries
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Durable, hashed successor proof for a deleted failed run; intentionally survives assurance.runs.failed retention."

  - owner: assurance
    class: assurance.cursors
    table: assurance.assurance_cursors
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "One-row-per-source pipeline cursor singleton; not an event history table."

  - owner: assurance
    class: assurance.findings.active
    table: assurance.assurance_findings
    classification: financial
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.1: retained while status IN ('open','acknowledged'). Never age-purged regardless of policy version."

  - owner: assurance
    class: assurance.findings.resolved
    table: assurance.assurance_findings
    classification: financial
    terminal_timestamp: resolved_at
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: resource
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Assurance resolved finding'. Only status='resolved' rows are ever eligible."

  - owner: assurance
    class: assurance.alert_deliveries
    table: assurance.assurance_alert_deliveries
    classification: internal
    terminal_timestamp: "COALESCE(delivered_at, next_attempt_at)"
    duration: 180d
    action: delete
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: >
      docs/roadmap/archive/51 §4.2 explicitly covers "failed alert delivery" at 180d;
      extended here to delivered rows too for one consistent rule across the
      table (T0 judgment call — not separately itemized in §4.2).

  - owner: assurance
    class: assurance.intake_commands
    table: assurance.intake_control_commands
    classification: personal
    terminal_timestamp: applied_at
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: >
      docs/roadmap/archive/51 §4.2 'Applied/rejected intake command'; pending/applying
      rows are never eligible. Same rule applied to payin/payout's equivalent
      intake_commands tables below for consistency across the three services
      that share this control-plane pattern.

  # ── auth ──────────────────────────────────────────────────────────────────
  - owner: auth
    class: auth.users
    table: auth.auth_users
    classification: personal
    terminal_timestamp: null
    duration: null
    action: pseudonymize_on_closure
    batch_size: 0
    hold_scope: subject
    policy_version: 1
    notes: >
      Never age-purged or generically deleted — migration comment: "users are
      disabled (status), never erased." email/full_name become K2 ciphertext;
      identity is only ever replaced with the T5 closure saga's surrogate.

  - owner: auth
    class: auth.credentials
    table: auth.auth_credentials
    classification: secret
    terminal_timestamp: null
    duration: null
    action: pseudonymize_on_closure
    batch_size: 0
    hold_scope: subject
    policy_version: 1
    notes: "1:1 with auth_users; removed only as part of T5 closure finalization, never by an independent age rule."

  - owner: auth
    class: auth.refresh_tokens
    table: auth.auth_refresh_tokens
    classification: secret
    terminal_timestamp: "COALESCE(revoked_at, expires_at)"
    duration: 30d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Expired/revoked refresh token'. Live (non-revoked, non-expired) tokens are never eligible."

  - owner: auth
    class: auth.kyc_submissions
    table: auth.kyc_submissions
    classification: sensitive
    terminal_timestamp: "auth_users closure time (join on kyc_submissions.user_id = auth_users.id)"
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: >
      docs/roadmap/archive/51 §4.2 'KYC submission and document': eligible only when
      the owning account has been closed more than 365 days and no hold
      applies — this is a closure-gated rule, not a standalone age rule on
      created_at/decided_at. `payload` becomes K2 ciphertext before this ever
      runs. The current schema uses the completed closure request's ready_at
      as the retention horizon rather than a separate closed_at column.

  - owner: auth
    class: auth.kyc_apply_retries.succeeded
    table: auth.kyc_apply_retries
    classification: personal
    terminal_timestamp: updated_at
    duration: 90d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Successful KYC apply retry'. Requires status='succeeded'."

  - owner: auth
    class: auth.kyc_apply_retries.dead
    table: auth.kyc_apply_retries
    classification: personal
    terminal_timestamp: updated_at
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Dead KYC apply retry'. Requires status='dead' and an audit summary to already exist (§4.3)."

  - owner: auth
    class: auth.kyc_retry_summaries
    table: auth.auth_kyc_retry_summaries
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Durable hashed successor proof retained after a dead KYC retry is removed."

  - owner: auth
    class: auth.kyc_level_changes
    table: auth.kyc_level_changes
    classification: personal
    terminal_timestamp: null
    duration: null
    action: pseudonymize_on_closure
    batch_size: 0
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2: retained as 'pseudonymous level-change audit' even after the owning KYC submission is deleted — never age-deleted, only pseudonymized on closure (K11)."

  - owner: auth
    class: auth.kyc_documents
    table: auth.kyc_documents
    classification: sensitive
    terminal_timestamp: "auth_users closure time (join on kyc_documents.user_id = auth_users.id)"
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: >
      Same closure-gated rule as auth.kyc_submissions (grouped together in
      §4.2). auth-service wires FileDocumentStore when OBJECT_STORE_DIR is
      configured; Upload/Download fail closed without the store or document
      key ring. The paired object is deleted through
      auth_object_delete_outbox before metadata removal.

  # ── auth: KYC document object store (not a Postgres table) ────────────────
  - owner: auth
    class: auth.kyc_document_object
    table: null
    object_class: "kyc document bytes (object store)"
    classification: sensitive
    terminal_timestamp: "paired auth.kyc_documents row's own terminal_timestamp"
    duration: 365d
    action: delete
    batch_size: 100
    hold_scope: subject
    policy_version: 1
    notes: >
      Object key is "kyc/<document_uuid>" (internal/auth/documents.go,
      docs/roadmap/archive/51 T2.3) — opaque, carries no user reference; the
      document/user relationship lives only in the encrypted
      auth.kyc_documents row. Deletion must use K6's
      delete-intent-then-delete-then-mark outbox pattern, paired 1:1 with
      that metadata row. The Compose auth service wires the local file-backed
      object store; host binaries require OBJECT_STORE_DIR, and the feature
      fails closed when it is absent.

  # ── fraud ─────────────────────────────────────────────────────────────────
  - owner: fraud
    class: fraud.screening_events
    table: fraud.screening_events
    classification: financial
    terminal_timestamp: created_at
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Fraud screening event'. Requires aggregate audit metrics to already be recorded (§4.3) before deletion."

  - owner: fraud
    class: fraud.screening_event_summaries
    table: fraud.fraud_screening_event_summaries
    classification: financial
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Non-identifying daily/rule/verdict aggregate successor proof, persisted atomically before screening event deletion."

  - owner: fraud
    class: fraud.screening_rule_modes
    table: fraud.screening_rule_modes
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Live per-rule config row (off/monitor/block); not an event history table."

  - owner: fraud
    class: fraud.sanctions_entries
    table: fraud.sanctions_entries
    classification: personal
    terminal_timestamp: null
    duration: null
    action: self_replacing
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: >
      Third-party (non-platform-user) sanctions/watchlist data from an
      external dataset. internal/fraud/repository/sanctions_repository.go
      already fully replaces the table on every dataset load
      (DELETE-all + re-INSERT) — no independent age-based job needed or
      wanted; a stale entry must not silently persist past its dataset
      version.

  # ── gateway ───────────────────────────────────────────────────────────────
  - owner: gateway
    class: gateway.notifications.read
    table: gateway.notif_notifications
    classification: financial
    terminal_timestamp: read_at
    duration: 180d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Read notification'. Requires read_at IS NOT NULL."

  - owner: gateway
    class: gateway.notifications.any
    table: gateway.notif_notifications
    classification: financial
    terminal_timestamp: created_at
    duration: 365d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Any notification' — backstop rule for unread notifications regardless of read_at."

  # ── gateway.merchant (docs/roadmap/active/57-c1-merchant-b2b-api.md T2) ────────────
  - owner: gateway
    class: gateway.merchant.tenants
    table: gateway.merchant_tenants
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Live tenant configuration row; no generic age rule. Tenant closure is a future operator workflow, not an automatic purge."

  - owner: gateway
    class: gateway.merchant.api_keys_revoked
    table: gateway.merchant_api_keys
    classification: secret
    terminal_timestamp: revoked_at
    duration: 90d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "Only revoked keys age out; active/expired-but-not-revoked keys are untouched. Cascades its own merchant_api_key_scopes rows in the same purge transaction."

  - owner: gateway
    class: gateway.merchant.api_key_scopes
    table: gateway.merchant_api_key_scopes
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "No independent timestamp column; rows are deleted transactionally alongside their parent merchant_api_keys row (gateway.merchant.api_keys_revoked), not by an independent age rule."

  - owner: gateway
    class: gateway.merchant.quota_policies
    table: gateway.merchant_quota_policies
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Live per-tenant quota configuration; no generic age rule applies."

  - owner: gateway
    class: gateway.merchant.idempotency_records
    table: gateway.merchant_idempotency_records
    classification: sensitive
    terminal_timestamp: expires_at
    duration: 24h
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "Same expiry-column-driven pattern as ledger.fee_quotes.unconsumed (T2.6 precedent) — purges shortly after the record's own expires_at, not a fixed age from creation. May contain tenant response bodies (sensitive), hence classification."

  - owner: gateway
    class: gateway.merchant.event_inbox
    table: gateway.merchant_event_inbox
    classification: internal
    terminal_timestamp: processed_at
    duration: 30d
    action: delete
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: "Requires processed_at IS NOT NULL — an unprocessed inbox row is never purged, regardless of age."

  - owner: gateway
    class: gateway.merchant.webhook_endpoints
    table: gateway.merchant_webhook_endpoints
    classification: secret
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Live endpoint configuration (secret_ciphertext is already encrypted via pkg/cryptox, T7); deletion is an explicit merchant/operator action (DELETE /webhook-endpoints/{id}), not an automatic age rule."

  - owner: gateway
    class: gateway.merchant.webhook_events
    table: gateway.merchant_webhook_events
    classification: sensitive
    terminal_timestamp: created_at
    duration: 90d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "Immutable external event bytes, purged once no merchant_webhook_deliveries row still references them (enforced in the purge function itself, not just the age check) — payload may carry tenant transaction data."

  - owner: gateway
    class: gateway.merchant.webhook_deliveries
    table: gateway.merchant_webhook_deliveries
    classification: internal
    terminal_timestamp: updated_at
    duration: 90d
    action: delete
    batch_size: 500
    hold_scope: subject
    policy_version: 1
    notes: "Requires status IN ('delivered','dead') — a pending/failed (still retrying) delivery is never purged regardless of age. merchant_webhook_attempts cascade-delete with their parent row (ON DELETE CASCADE), so they need no independent purge function."

  - owner: gateway
    class: gateway.merchant.tenant_lifecycle_requests
    table: gateway.merchant_tenant_lifecycle_requests
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Plan 57 T8. Maker-checker record for tenant live-mode activation and closure — same shape and rationale as auth.operator_offboarding_requests: requested_by/approved_by are OPERATOR identities (never the tenant's own data), reason is an operator-authored justification, and the row is the permanent two-person-control audit trail proving who proposed and who approved each sensitive tenant transition. Retained permanently, same append-only rationale as auth.retention_audit."

  - owner: gateway
    class: gateway.merchant.settings
    table: gateway.merchant_settings
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Plan 57 T9. Generic operational key/value store — currently one row, b2b_api_enabled (the global route-disable kill switch). Live configuration, not an event log; no generic age rule applies, same posture as gateway.merchant.quota_policies."

  - owner: gateway
    class: gateway.merchant.webhook_attempts
    table: gateway.merchant_webhook_attempts
    classification: internal
    terminal_timestamp: null
    duration: null
    action: retain_state
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "No independent age rule — rows are removed transactionally via ON DELETE CASCADE when their parent merchant_webhook_deliveries row is purged (gateway.merchant.webhook_deliveries)."

  # ── ledger ────────────────────────────────────────────────────────────────
  - owner: ledger
    class: ledger.ledger_entries
    table: ledger.ledger_entries
    classification: financial
    terminal_timestamp: null
    duration: null
    action: retain_immutable
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.1. DB trigger fn_prevent_entry_mutation rejects UPDATE/DELETE regardless of caller — structurally, not just policy, immutable."

  - owner: ledger
    class: ledger.ledger_transactions
    table: ledger.ledger_transactions
    classification: financial
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.1 'posted transaction headers, lifecycle closers'. idempotency_key/idempotency_scope become K7 digest tombstones in T3, handled by a separate class below — this class covers everything else in the row."

  - owner: ledger
    class: ledger.transactions.idempotency_raw
    table: ledger.ledger_transactions
    classification: secret
    terminal_timestamp: updated_at
    duration: 30d
    action: redact
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: >
      docs/roadmap/archive/51 K7: nulls idempotency_key/idempotency_scope 30 days after
      the transaction reaches a terminal status, once T3's digest/version/
      conflict-fingerprint columns exist and are backfilled. Requires
      status IN ('posted','failed','reversed'). Never touches the row's
      financial fields.

  - owner: ledger
    class: ledger.accounts
    table: ledger.accounts
    classification: financial
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "owner_id is pseudonymized (not purged) by the T5 closure saga per K10/K11; otherwise never age-purged."

  - owner: ledger
    class: ledger.account_balances
    table: ledger.account_balances
    classification: financial
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Current-state balance projection; not an event history row."

  - owner: ledger
    class: ledger.account_balance_snapshots
    table: ledger.account_balance_snapshots
    classification: financial
    terminal_timestamp: null
    duration: null
    action: retain_permanent
    batch_size: 0
    hold_scope: none
    policy_version: 1
    notes: "Dated historical snapshot; the daily job may DELETE+re-INSERT a single date's rows to correct a bad snapshot, which is a correctness fix, not an age-based retention action."

  - owner: ledger
    class: ledger.outbox_events.published
    table: ledger.outbox_events
    classification: financial
    terminal_timestamp: published_at
    duration: 30d
    action: delete
    batch_size: 500
    hold_scope: none
    policy_version: 1
    notes: "docs/roadmap/archive/51 §4.2 'Published ledger outbox event'. Requires status='published'."

