version: v2
modules:
  - path: contracts/proto
lint:
  use:
    - STANDARD
  except:
    # The locked ledger contract returns the shared Transaction message and
    # intentionally uses the concise GetTxByIdemKeyRequest wire name.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # GetTransactionByIdempotencyKey and GetMerchantTransaction intentionally
    # return the same locked Transaction message.
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
